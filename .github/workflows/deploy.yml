name: Deploy

on:
  push:
    branches:
      - main
      - 'e-grimoire-*'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deploy main → site root (keeps preview/ intact)
      - name: Deploy main to root
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          clean: true
          clean-exclude: preview

      # Deploy feature branch → /preview/
      - name: Deploy branch to preview
        if: github.ref_name != 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: .
          target-folder: preview
          clean: true
