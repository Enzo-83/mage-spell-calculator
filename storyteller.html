<script type="text/babel">
const { useState, useEffect, useRef } = React;

};

const ARCANUM_HEX = {
  death:"#475569", fate:"#e2e8f0", forces:"#f87171", life:"#4ade80",

// ── Tilts & Conditions Catalog ───────────────────────────────────────────
// Firestore collection "tiltsConditions" — mirrors the Spell Compendium pattern.

const TiltsCatalog = (() => {
  let _entries   = [];
  let _listeners = [];
  let _unsub     = null;

  const VALID_TYPES  = ['tilt', 'condition'];
  const CSV_COLUMNS  = ['name','type','persistent','environmental','description',
                        'resolution','beat','effect','causing','ending','sourceBook','sourcePage'];

  function subscribe() {
    if (_unsub) _unsub();
    _unsub = _fsDb.collection('tiltsConditions')
      .orderBy('name')
      .onSnapshot(snap => {
        _entries = [];
        snap.forEach(doc => { const d = doc.data(); d.id = doc.id; _entries.push(d); });
        _listeners.forEach(fn => fn([..._entries]));
      }, err => console.error('TiltsCatalog snapshot error:', err));
  }

  function useCatalog() {
    const [catalog, setCatalog] = React.useState(_entries);
    React.useEffect(() => {
      _listeners.push(setCatalog);
      setCatalog([..._entries]);
      return () => { _listeners = _listeners.filter(fn => fn !== setCatalog); };
    }, []);
    return catalog;
  }

  function parseCsvRow(line) {
    var result = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (inQ) {
        if (ch === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else { inQ = false; } }
        else { cur += ch; }
      } else {
        if (ch === '"')      { inQ = true; }
        else if (ch === ',') { result.push(cur.trim()); cur = ''; }
        else                 { cur += ch; }
      }
    }
    result.push(cur.trim());
    return result;
  }

  function csvToEntries(text) {
    const lines = text.replace(/^﻿/, '').split(/\r?\n/);
    const entries = [];
    let headerIdx = -1;
    for (let i = 0; i < lines.length; i++) {
      const l = lines[i].trim();
      if (!l || l.startsWith('#')) continue;
      headerIdx = i; break;
    }
    if (headerIdx < 0) return entries;
    const headers = parseCsvRow(lines[headerIdx]).map(h => h.toLowerCase().trim());
    for (let i = headerIdx + 1; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line || line.startsWith('#')) continue;
      const cols = parseCsvRow(lines[i]);
      const row  = {};
      headers.forEach((h, idx) => { row[h] = (cols[idx] || '').trim(); });
      if (!row.name) continue;
      function parseBool(val) {
        const v = (val || '').toLowerCase();
        return v === 'yes' || v === 'true' || v === '1';
      }
      entries.push({
        name: row.name, type: (row.type || 'tilt').toLowerCase(),
        persistent: parseBool(row.persistent), environmental: parseBool(row.environmental),
        description: row.description || '',
        resolution: row.resolution || '', beat: row.beat || '',
        effect: row.effect || '', causing: row.causing || '', ending: row.ending || '',
        sourceBook: row.sourcebook || '',
        sourcePage: row.sourcepage ? parseInt(row.sourcepage, 10) : null,
      });
    }
    return entries;
  }

  function validate(e) {
    const errs = [];
    if (!e.name || !e.name.trim()) errs.push('name required');
    if (VALID_TYPES.indexOf(e.type) === -1) errs.push('type must be tilt or condition');
    return errs;
  }

  function sanitise(e) {
    return {
      name: String(e.name).trim(), type: e.type,
      persistent: !!e.persistent, environmental: !!e.environmental,
      description: String(e.description || '').trim(),
      resolution: String(e.resolution || '').trim(), beat: String(e.beat || '').trim(),
      effect: String(e.effect || '').trim(), causing: String(e.causing || '').trim(),
      ending: String(e.ending || '').trim(),
      sourceBook: String(e.sourceBook || '').trim(),
      sourcePage: e.sourcePage ? parseInt(e.sourcePage, 10) : null,
    };
  }

  async function doImport(raw, overwrite, onStatus, onProgress) {
    const entries = raw.filter(e => e && e.name && !e.name.startsWith('#'));
    if (!entries.length) { onStatus('No valid entries found.', 'warn'); return; }
    const valid = [], invalid = [];
    entries.forEach((e, idx) => {
      const errs = validate(e);
      if (errs.length) invalid.push({ idx: idx+1, name: e.name || '(unnamed)', errs });
      else valid.push(sanitise(e));
    });
    if (invalid.length) {
      const msgs = invalid.map(e => `#${e.idx} "${e.name}": ${e.errs.join(', ')}`).join('\n');
      onStatus(`⚠️ ${invalid.length} entries skipped:\n${msgs}`, 'warn');
    }
    if (!valid.length) { onStatus('No valid entries after validation.', 'err'); return; }
    const existingKeys = {};
    _entries.forEach(e => { existingKeys[e.name.toLowerCase()] = e.id; });
    const toAdd = [], toUpdate = [];
    let skipped = 0;
    valid.forEach(e => {
      const key = e.name.toLowerCase();
      if (existingKeys[key]) { if (overwrite) toUpdate.push({ id: existingKeys[key], data: e }); else skipped++; }
      else toAdd.push(e);
    });
    const total = toAdd.length + toUpdate.length;
    if (!total) { onStatus(`All ${skipped} entries already exist. Enable "Overwrite" to update.`, 'warn'); return; }
    const CHUNK = 499;
    const allOps = [...toAdd.map(e => ({ type:'add', data:e })), ...toUpdate.map(u => ({ type:'update', id:u.id, data:u.data }))];
    let done = 0, errors = 0;
    const now = firebase.firestore.FieldValue.serverTimestamp();
    for (let i = 0; i < allOps.length; i += CHUNK) {
      const chunk = allOps.slice(i, i + CHUNK);
      const batch = _fsDb.batch();
      chunk.forEach(op => {
        op.data.updatedAt = now;
        if (op.type === 'add') { op.data.createdAt = now; batch.set(_fsDb.collection('tiltsConditions').doc(), op.data); }
        else { batch.update(_fsDb.collection('tiltsConditions').doc(op.id), op.data); }
      });
      try { await batch.commit(); done += chunk.length; }
      catch (e) { errors += chunk.length; console.error('Import batch error:', e); }
      if (onProgress) onProgress(done + errors, total);
    }
    const parts = [];
    if (toAdd.length)    parts.push(`${toAdd.length} added`);
    if (toUpdate.length) parts.push(`${toUpdate.length} updated`);
    if (skipped)         parts.push(`${skipped} skipped`);
    if (invalid.length)  parts.push(`${invalid.length} invalid`);
    if (errors)          parts.push(`${errors} batch errors`);
    onStatus(`✓ Import complete — ${parts.join(', ')}.`, errors ? 'warn' : 'ok');
  }

  function downloadTemplate() {
    const header = CSV_COLUMNS.join(',');
    const note = [
      '# DELETE these comment rows before importing.',
      '# type: tilt | condition',
      '# persistent: yes | no  (Conditions marked "(Persistent)")',
      '# environmental: yes | no  (Tilts marked "(Environmental)")',
      '# Conditions: fill description + resolution + beat. Leave effect/causing/ending empty.',
      '# Tilts: fill description + effect + causing + ending. Leave resolution/beat empty.',
      '# Wrap text containing commas in double-quotes.',
      '# sourceBook: optional, e.g. core, signs-of-sorcery',
    ].join('\n');
    const sample = ['Addicted','condition','yes','no',
      '"Your character is addicted to something."',
      '"Regain a dot of Integrity or lose another dot."',
      '"Your character chooses a fix over an obligation."',
      '""','""','""','core','289'].join(',');
    const csv  = note + '\n' + header + '\n' + sample;
    const blob = new Blob([csv], { type:'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'tilts-conditions-template.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  async function exportCsv(onStatus) {
    function csvCell(val) {
      if (val === null || val === undefined) return '';
      const s = String(val);
      if (s.includes(',') || s.includes('"') || s.includes('\n')) return '"' + s.replace(/"/g, '""') + '"';
      return s;
    }
    if (!_entries.length) { onStatus('No entries in catalog.', 'warn'); return; }
    const rows = [CSV_COLUMNS.join(',')];
    _entries.forEach(e => {
      rows.push([
        csvCell(e.name), csvCell(e.type),
        csvCell(e.persistent ? 'yes' : 'no'), csvCell(e.environmental ? 'yes' : 'no'),
        csvCell(e.description), csvCell(e.resolution), csvCell(e.beat),
        csvCell(e.effect), csvCell(e.causing), csvCell(e.ending),
        csvCell(e.sourceBook), csvCell(e.sourcePage),
      ].join(','));
    });
    const blob = new Blob([rows.join('\r\n')], { type:'text/csv' });
    const url  = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'tilts-conditions-export-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
    URL.revokeObjectURL(url);
    onStatus(`✓ Exported ${_entries.length} entries.`, 'ok');
  }

  function handleImportFile(file, overwrite, onStatus, onProgress) {
    if (!file) return;
    if (!file.name.toLowerCase().endsWith('.csv')) { onStatus('Please upload a .csv file.', 'err'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const raw = csvToEntries(e.target.result);
        if (!raw.length) { onStatus('No data rows found. Check header row.', 'warn'); return; }
        doImport(raw, overwrite, onStatus, onProgress);
      } catch (err) { onStatus('CSV parse error — ' + err.message, 'err'); }
    };
    reader.readAsText(file);
  }

  function getEntryCount() { return _entries.length; }

  return { subscribe, useCatalog, handleImportFile, downloadTemplate, exportCsv, getEntryCount };
})();

        fontWeight:700, color: color || C.text }}>
        {value}
      </span>
      <button onClick={() => onChange(Math.min(max, value + 1))}
        style={{ width:24, height:24, borderRadius:4, cursor:"pointer",
          border:`1px solid ${C.border}`, background:C.bgDeep,
          color:C.textMuted, fontSize:15, lineHeight:1,

  );
}

// ── PlayerCard ────────────────────────────────────────────────────────────

function PlayerCard({ pid, player, sessionCode, sceneActive }) {
  const [spellsOpen,       setSpellsOpen]       = useState(false);
  const [tiltInput,        setTiltInput]        = useState("");
  const [tiltDropdownOpen, setTiltDropdownOpen] = useState(false);
  const catalog     = TiltsCatalog.useCatalog();
  const [sheetInput,       setSheetInput]       = useState(player.sheetLink || "");
  const [sheetEditing,     setSheetEditing]     = useState(false);
  const tiltInputRef    = useRef(null);
  const tiltDropdownRef = useRef(null);

  // Keep sheetInput in sync when player.sheetLink changes externally
  useEffect(() => {
    if (!sheetEditing) setSheetInput(player.sheetLink || "");
  }, [player.sheetLink, sheetEditing]);

  useEffect(() => {
    function handleClick(e) {
      const inInput    = tiltInputRef.current    && tiltInputRef.current.parentElement.contains(e.target);
      const inDropdown = tiltDropdownRef.current && tiltDropdownRef.current.contains(e.target);
      if (!inInput && !inDropdown) setTiltDropdownOpen(false);
    }
    function handleDismiss() { setTiltDropdownOpen(false); }
    document.addEventListener("mousedown", handleClick);
    window.addEventListener("scroll", handleDismiss, true);
    window.addEventListener("resize", handleDismiss);
    return () => {
      document.removeEventListener("mousedown", handleClick);
      window.removeEventListener("scroll", handleDismiss, true);
      window.removeEventListener("resize", handleDismiss);
    };
  }, []);

  const s      = player.stats  || {};
  const h      = s.health      || { max:7, bashing:0, lethal:0, aggravated:0 };
  const m      = s.mana        || { current:0, max:10 };
  const wp     = s.willpower   || { current:5, max:5 };
  const spells = Array.isArray(s.activeSpells) ? s.activeSpells : [];
  const tilts  = Array.isArray(player.tilts)   ? player.tilts   : [];

  const paradoxRolls = player.paradoxRolls || 0;
  const stAdj        = player.stAdjustment  || 0;
  const effectiveDox = Math.max(0, paradoxRolls + stAdj);

  // ── Stat writers ───────────────────────────────────────────────────────

  function pushStatEdit(partial) {
    sessionSTEditStats(sessionCode, pid, partial);
  }

  function setHealthType(type, val) {
    const next = {
      max:        h.max,
      bashing:    h.bashing    || 0,
      lethal:     h.lethal     || 0,
      aggravated: h.aggravated || 0,
      [type]: Math.max(0, val),
    };
    // Cap total at max
    const sum = next.aggravated + next.lethal + next.bashing;
    if (sum > next.max) next[type] = Math.max(0, next[type] - (sum - next.max));
    pushStatEdit({ health: next });
  }

  function setMana(val) {
    pushStatEdit({ mana: { current: Math.max(0, Math.min(m.max, val)), max: m.max } });
  }

  function setWillpower(val) {
    pushStatEdit({ willpower: { current: Math.max(0, Math.min(wp.max, val)), max: wp.max } });
  }

  function setParadoxAdj(delta) {
    sessionSetAdjustment(sessionCode, pid, stAdj + delta, player.stNote || "");
  }

  // ── Tilts ──────────────────────────────────────────────────────────────

  function addTilt() {
    const t = tiltInput.trim();
    if (!t || tilts.includes(t)) return;
    sessionSetTilts(sessionCode, pid, [...tilts, t]);
    setTiltInput("");
    setTiltDropdownOpen(false);
  }

  function addTiltFromCatalog(name) {
    if (!tilts.includes(name)) {
      sessionSetTilts(sessionCode, pid, [...tilts, name]);
    }
    setTiltInput("");
    setTiltDropdownOpen(false);
  }

  function removeTilt(i) {
    sessionSetTilts(sessionCode, pid, tilts.filter((_, idx) => idx !== i));
  }

  const filteredCatalog = tiltInput.trim()
    ? catalog.filter(c => c.name.toLowerCase().includes(tiltInput.toLowerCase()))
    : catalog;
  const grouped = {
    tilt:      filteredCatalog.filter(c => c.type === "tilt"),
    condition: filteredCatalog.filter(c => c.type === "condition"),
  };
  const exactMatch = catalog.some(c => c.name.toLowerCase() === tiltInput.trim().toLowerCase());
  const catalogByName = {};
  catalog.forEach(c => { catalogByName[c.name.toLowerCase()] = c; });

  // ── Sheet link ─────────────────────────────────────────────────────────

  function saveSheetLink() {
    sessionSetSheetLink(sessionCode, pid, sheetInput.trim());
    setSheetEditing(false);
  }

  // ── Health track ───────────────────────────────────────────────────────

  const shFilled = (h.aggravated || 0) + (h.lethal || 0) + (h.bashing || 0);
  const shWound  = shFilled >= h.max ? -3
                 : shFilled >= h.max - 1 ? -2
                 : shFilled >= h.max - 2 ? -1 : 0;

  function healthBoxStyle(i) {
    if (i < (h.aggravated || 0))
      return { sym:"✦", bg:"rgba(199,62,29,0.25)", fg:C.danger,   bd:C.danger   };
    if (i < (h.aggravated || 0) + (h.lethal || 0))
      return { sym:"✕", bg:"rgba(233,196,106,0.18)", fg:C.warning, bd:C.warning };
    if (i < shFilled)
      return { sym:"/",  bg:C.bgCard,              fg:C.text,    bd:C.borderLight };
    return   { sym:"",   bg:C.bgDeep,              fg:C.textMuted, bd:C.border  };
  }

  const doxColor = effectiveDox >= 5 ? C.danger
                 : effectiveDox >= 3 ? C.warning
                 : C.text;

  // ── Render ─────────────────────────────────────────────────────────────

  return (
    <div style={{ background:C.bgCard, border:`1px solid ${C.accentBorder}`,
      borderRadius:12, overflow:"visible" }}>

      {/* ── Header ── */}
      <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`,
        background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})`,
        display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
        <div style={{ minWidth:0 }}>
          <span style={{ fontSize:14, fontWeight:700, color:C.text }}>
            {player.name || pid}
          </span>
          {player.path && (
            <span style={{ fontSize:11, color:C.accentLight, marginLeft:6 }}>
              {player.path}
            </span>
          )}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
          {player.sheetLink && !sheetEditing && (
            <a href={player.sheetLink} target="_blank" rel="noopener noreferrer"
              style={{ fontSize:11, padding:"3px 9px", borderRadius:5,
                background:C.accentFaint, border:`1px solid ${C.accentBorder}`,
                color:C.accentLight, textDecoration:"none" }}>
              Sheet ↗
            </a>
          )}
          <button
            onClick={() => { setSheetEditing(e => !e); setSheetInput(player.sheetLink || ""); }}
            style={{ fontSize:10, padding:"3px 8px", borderRadius:5, cursor:"pointer",
              background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted }}>
            {sheetEditing ? "Cancel" : player.sheetLink ? "Edit" : "+ Sheet"}
          </button>
        </div>
      </div>

      {/* ── Sheet link editor ── */}
      {sheetEditing && (
        <div style={{ padding:"8px 14px", borderBottom:`1px solid ${C.border}`,
          background:"rgba(123,44,191,0.06)", display:"flex", gap:6 }}>
          <input value={sheetInput} onChange={e => setSheetInput(e.target.value)}
            placeholder="https://docs.google.com/…"
            style={{ flex:1, padding:"5px 8px", borderRadius:6, fontSize:11,
              background:C.bgDeep, border:`1px solid ${C.accentBorder}`,
              color:C.text, outline:"none" }} />
          <button onClick={saveSheetLink}
            style={{ padding:"5px 12px", borderRadius:6, cursor:"pointer",
              border:"none", background:C.accent, color:"#fff",
              fontSize:11, fontWeight:700 }}>
            Save
          </button>
        </div>
      )}

      <div style={{ padding:"12px 14px" }}>

        {/* ── Paradox ── */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
          marginBottom:10, padding:"7px 10px", borderRadius:7,
          background: effectiveDox > 0 ? C.dangerFaint : C.bgDeep,
          border:`1px solid ${effectiveDox > 0 ? "rgba(199,62,29,0.3)" : C.border}` }}>
          <div>
            <FieldLabel>Paradox</FieldLabel>
            <span style={{ fontSize:22, fontWeight:700, color:doxColor, lineHeight:1 }}>
              {effectiveDox}
            </span>
            {stAdj !== 0 && (
              <span style={{ fontSize:11, color:C.textMuted, marginLeft:7 }}>
                ({paradoxRolls} + {stAdj >= 0 ? "+" : ""}{stAdj} ST)

            )}
            {player.stNote ? (
              <div style={{ fontSize:10, color:C.warning, marginTop:2 }}>{player.stNote}</div>
            ) : null}
          </div>
          {sceneActive && (
            <div style={{ display:"flex", gap:4 }}>
              <button onClick={() => setParadoxAdj(-1)}
                style={{ width:28, height:28, borderRadius:5, cursor:"pointer",
                  border:`1px solid ${C.border}`, background:C.bgCard,
                  color:C.text, fontSize:16 }}>−</button>
              <button onClick={() => setParadoxAdj(1)}
                style={{ width:28, height:28, borderRadius:5, cursor:"pointer",
                  border:`1px solid ${C.border}`, background:C.bgCard,
                  color:C.text, fontSize:16 }}>+</button>
            </div>
          )}
        </div>

        {/* ── Health track ── */}
        <div style={{ marginBottom:10 }}>
          <div style={{ display:"flex", justifyContent:"space-between",
            alignItems:"center", marginBottom:4 }}>
            <FieldLabel>Health</FieldLabel>
            {shWound < 0 && (
              <span style={{ fontSize:9, color:C.danger }}>Wound {shWound}</span>
            )}
          </div>
          {/* Visual track */}
          <div style={{ display:"flex", gap:2, marginBottom:6 }}>
            {Array.from({ length: h.max || 7 }).map((_, i) => {
              const { sym, bg, fg, bd } = healthBoxStyle(i);
              return (
                <div key={i} style={{ flex:1, textAlign:"center", padding:"3px 0",
                  borderRadius:3, background:bg, border:`1px solid ${bd}`,
                  fontSize:10, fontWeight:700, color:fg, minWidth:0 }}>
                  {sym || "\u00A0"}
                </div>
              );
            })}
          </div>
          {/* Per-type steppers */}
          <div style={{ display:"flex", gap:6 }}>
            {[["✦ Agg", "aggravated", C.danger],
              ["✕ Let", "lethal",     C.warning],
              ["/ Bash","bashing",    C.text]
            ].map(([label, type, color]) => (
              <div key={type} style={{ flex:1, textAlign:"center" }}>
                <div style={{ fontSize:9, color:C.textMuted, marginBottom:3 }}>{label}</div>
                <Stepper
                  value={h[type] || 0}
                  max={h.max || 7}
                  onChange={v => setHealthType(type, v)}
                  color={color}
                />
              </div>
            ))}
          </div>
        </div>

        {/* ── Mana & Willpower ── */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10 }}>
          <div style={{ padding:"8px 10px", borderRadius:7,
            background:C.bgDeep, border:`1px solid ${C.border}` }}>
            <FieldLabel>Mana</FieldLabel>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <Stepper
                value={m.current ?? 0}
                max={m.max ?? 10}
                onChange={setMana}
                color={m.current < 3 ? C.danger : m.current < (m.max / 2) ? C.warning : C.text}
              />
              <span style={{ fontSize:11, color:C.textMuted }}>/ {m.max ?? 10}</span>
            </div>
          </div>
          <div style={{ padding:"8px 10px", borderRadius:7,
            background:C.bgDeep, border:`1px solid ${C.border}` }}>
            <FieldLabel>Willpower</FieldLabel>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <Stepper
                value={wp.current ?? 5}
                max={wp.max ?? 5}
                onChange={setWillpower}
                color={wp.current < 2 ? C.danger : C.text}
              />
              <span style={{ fontSize:11, color:C.textMuted }}>/ {wp.max ?? 5}</span>
            </div>
          </div>
        </div>

        {/* ── Active Spells ── */}
        <div style={{ marginBottom:10 }}>
          <button onClick={() => setSpellsOpen(o => !o)}
            style={{ width:"100%", display:"flex", alignItems:"center",
              justifyContent:"space-between", padding:"7px 10px", borderRadius:7,
              background:C.bgDeep, border:`1px solid ${C.border}`,
              color:C.text, cursor:"pointer", fontSize:12 }}>
            <span style={{ fontWeight:600 }}>
              ⚡ Active Spells
              <span style={{ marginLeft:7, fontSize:11,
                color: spells.length > 0 ? C.accentLight : C.textMuted }}>
                {spells.length} / {s.maxActiveSpells || s.gnosis || 1}
              </span>
            </span>
            <span style={{ color:C.textMuted, fontSize:10 }}>
              {spellsOpen ? "▲" : "▼"}
            </span>
          </button>
          {spellsOpen && (
            <div style={{ marginTop:4, borderRadius:7,
              border:`1px solid ${C.border}`, overflow:"hidden" }}>
              {spells.length === 0 ? (
                <div style={{ padding:"10px 12px", fontSize:11,
                  color:C.textMuted, textAlign:"center" }}>
                  No active spells
                </div>
              ) : spells.map((sp, i) => {
                const arc      = (sp.arcanum || "prime").toLowerCase();
                const dotColor = ARCANUM_HEX[arc] || C.accentLight;
                const dots     = "●".repeat(Math.min(sp.arcanumLevel || 1, 5));
                return (
                  <div key={sp.id || i}
                    style={{ padding:"8px 12px",
                      borderBottom: i < spells.length - 1
                        ? `1px solid ${C.borderLight}` : "none",
                      background: i % 2 === 0 ? C.bgDeep : "transparent" }}>
                    <div style={{ fontWeight:600, fontSize:13, color:C.text }}>
                      {sp.name}
                    </div>
                    <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>
                      <span style={{ color:dotColor }}>
                        {arc.charAt(0).toUpperCase() + arc.slice(1)} {dots}
                      </span>
                      {" · "}Pot {sp.potency}
                      {" · "}{sp.duration}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── Tilts & Conditions ── */}
        <div>
          <FieldLabel>Tilts &amp; Conditions</FieldLabel>
          <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginBottom:6,
            minHeight: tilts.length > 0 ? "auto" : 0 }}>
            {tilts.map((t, i) => {
              const ce = catalogByName[t.toLowerCase()];
              return (
                <span key={i}
                  title={ce
                    ? ce.type === "condition"
                      ? [ce.description, ce.resolution ? "Resolution: " + ce.resolution : "", ce.beat && ce.beat !== "n/a" ? "Beat: " + ce.beat : ""].filter(Boolean).join("\n\n")
                      : [ce.description, ce.effect ? "Effect: " + ce.effect : "", ce.ending ? "Ending: " + ce.ending : ""].filter(Boolean).join("\n\n")
                    : t}
                  style={{ display:"inline-flex", alignItems:"center", gap:4,
                    padding:"3px 8px", borderRadius:20, fontSize:11,
                    background: ce?.persistent ? "rgba(199,62,29,0.15)" : ce?.environmental ? "rgba(42,157,143,0.15)" : C.warningFaint,
                    border:`1px solid ${ce?.persistent ? "rgba(199,62,29,0.3)" : ce?.environmental ? "rgba(42,157,143,0.3)" : "rgba(233,196,106,0.3)"}`,
                    color: ce?.persistent ? C.danger : ce?.environmental ? "#2a9d8f" : C.warning }}>
                  {t}
                  {ce?.persistent    && <span style={{ fontSize:8, opacity:0.7 }}>⟳</span>}
                  {ce?.environmental && <span style={{ fontSize:8, opacity:0.7 }}>🌍</span>}
                  <button onClick={() => removeTilt(i)}
                    style={{ background:"transparent", border:"none",
                      color: ce?.persistent ? C.danger : ce?.environmental ? "#2a9d8f" : C.warning,
                      cursor:"pointer", fontSize:13, lineHeight:1, padding:0, opacity:0.7 }}>
                    ×
                  </button>
                </span>
              );
            })}
            {tilts.length === 0 && (
              <span style={{ fontSize:11, color:C.textMuted }}>None</span>
            )}
          </div>
          {/* ── Input row ── */}
          <div style={{ display:"flex", gap:6 }}>
            <input
              ref={tiltInputRef}
              value={tiltInput}
              onChange={e => { setTiltInput(e.target.value); setTiltDropdownOpen(true); }}
              onFocus={() => setTiltDropdownOpen(true)}
              onKeyDown={e => {
                if (e.key === "Enter") {
                  if (exactMatch) {
                    const match = catalog.find(c => c.name.toLowerCase() === tiltInput.trim().toLowerCase());
                    if (match) addTiltFromCatalog(match.name);
                  } else {
                    addTilt();
                  }
                } else if (e.key === "Escape") {
                  setTiltDropdownOpen(false);
                }
              }}
              placeholder="Add tilt or condition…"
              style={{ flex:1, padding:"5px 8px", borderRadius:6, fontSize:11,
                background:C.bgDeep, border:`1px solid ${C.border}`,
                color:C.text, outline:"none" }}
            />
            <button onClick={addTilt}
              style={{ padding:"5px 12px", borderRadius:6, cursor:"pointer",
                border:`1px solid ${C.accentBorder}`, background:C.accentFaint,
                color:C.accentLight, fontSize:13, fontWeight:700 }}>
              +
            </button>
          </div>
          {/* ── Dropdown portaled to body to escape overflow:hidden ── */}
          {tiltDropdownOpen && (filteredCatalog.length > 0 || tiltInput.trim()) &&
            ReactDOM.createPortal(
              (() => {
                function getDropdownPos() {
                  if (!tiltInputRef.current) return { top:0, left:0, width:200 };
                  const rect = tiltInputRef.current.getBoundingClientRect();
                  const dropdownH = 244;
                  const spaceBelow = window.innerHeight - rect.bottom;
                  const openUpward = spaceBelow < dropdownH && rect.top > dropdownH;
                  return {
                    left:   rect.left,
                    width:  rect.width + 42,
                    top:    openUpward ? undefined : rect.bottom + 4,
                    bottom: openUpward ? (window.innerHeight - rect.top + 4) : undefined,
                  };
                }
                const pos = getDropdownPos();
                return (
                  <div ref={tiltDropdownRef} style={{
                    position:"fixed", zIndex:9999,
                    left:pos.left, width:pos.width,
                    top:pos.top, bottom:pos.bottom,
                    maxHeight:220, overflowY:"auto",
                    background:C.bgCard, border:`1px solid ${C.border}`, borderRadius:8,
                    boxShadow:"0 8px 32px rgba(0,0,0,0.6)"
                  }}>
                    {["tilt","condition"].map(type => (
                      grouped[type].length > 0 && (
                        <div key={type}>
                          <div style={{ padding:"6px 10px", fontSize:10, color:C.textMuted,
                            textTransform:"uppercase", letterSpacing:1 }}>
                            {type === "tilt" ? "Tilts" : "Conditions"}
                          </div>
                          {grouped[type].map(c => (
                            <div key={c.name}
                              onMouseDown={e => { e.preventDefault(); addTiltFromCatalog(c.name); }}
                              style={{ padding:"6px 10px", cursor:"pointer", fontSize:12, color:C.text }}
                              onMouseEnter={e => e.currentTarget.style.background = C.bgDeep}
                              onMouseLeave={e => e.currentTarget.style.background = "transparent"}>
                              <div style={{ fontWeight:600 }}>
                                {c.name}
                                {c.persistent && (
                                  <span style={{ marginLeft:6, fontSize:9, padding:"1px 5px",
                                    borderRadius:4, background:"rgba(199,62,29,0.2)", color:C.danger,
                                    verticalAlign:"middle" }}>PERSISTENT</span>
                                )}
                                {c.environmental && (
                                  <span style={{ marginLeft:6, fontSize:9, padding:"1px 5px",
                                    borderRadius:4, background:"rgba(42,157,143,0.2)", color:"#2a9d8f",
                                    verticalAlign:"middle" }}>ENVIRONMENTAL</span>
                                )}
                              </div>
                              {c.description && (
                                <div style={{ fontSize:10, color:C.textMuted,
                                  whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                                  {c.description}
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      )
                    ))}
                    {!exactMatch && tiltInput.trim() && (
                      <div onMouseDown={e => { e.preventDefault(); addTilt(); }}
                        style={{ padding:"8px 10px", cursor:"pointer", fontSize:12,
                          color:C.accentLight, borderTop:`1px solid ${C.border}` }}>
                        + Add custom: <strong>{tiltInput.trim()}</strong>
                      </div>
                    )}
                  </div>
                );
              })(),
              document.body
            )
          }
        </div>

      </div>
    </div>
  );
}

// ── SceneLog ──────────────────────────────────────────────────────────────

function SceneLog({ sessionCode, scenes, currentSceneId }) {
  const [openSceneId, setOpenSceneId] = useState(currentSceneId);
  const [logs, setLogs] = useState({});

  useEffect(() => { setOpenSceneId(currentSceneId); }, [currentSceneId]);

  useEffect(() => {
    if (!sessionCode || !openSceneId) return;
    const ref = sessionGetRef(sessionCode).child("scenes/" + openSceneId + "/log");
    const cb  = ref.on("value", snap => {
      const raw = snap.val() || {};
      setLogs(prev => ({
        ...prev,
        [openSceneId]: Object.values(raw).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)),
      }));
    });
    return () => ref.off("value", cb);
  }, [sessionCode, openSceneId]);

  const sceneList = Object.entries(scenes || {})
    .sort((a, b) => (a[1].number || 0) - (b[1].number || 0));

  const currentLogs = logs[openSceneId] || [];

  const logIcon = type => ({
    paradox:     "🎲",
    spell:       "⚡",
    tilt:        "⚠️",
    stat_change: "✏️",
    note:        "📝",
  })[type] || "•";

  return (
    <div style={{ background:C.bgCard, border:`1px solid ${C.border}`,
      borderRadius:12, overflow:"hidden" }}>
      <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`,
        background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})` }}>
        <span style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,
          letterSpacing:2, textTransform:"uppercase", color:C.accentLight }}>
          Session Log
        </span>
      </div>

      {/* Scene selector tabs */}
      {sceneList.length > 0 && (
        <div style={{ display:"flex", gap:4, padding:"8px 14px",
          borderBottom:`1px solid ${C.border}`, flexWrap:"wrap" }}>
          {sceneList.map(([sid, sc]) => (
            <button key={sid} onClick={() => setOpenSceneId(sid)}
              style={{ padding:"3px 10px", borderRadius:20, cursor:"pointer", fontSize:11,
                border:`1px solid ${sid === openSceneId ? C.accentBorder : C.border}`,
                background: sid === openSceneId ? C.accentFaint : "transparent",
                color: sid === openSceneId ? C.accentLight : C.textMuted,
                fontWeight: sid === currentSceneId ? 700 : 400 }}>
              Scene {sc.number || "—"}
              {sid === currentSceneId && sc.active ? " ●" : ""}
            </button>
          ))}
        </div>
      )}

      {/* Log entries */}
      <div style={{ overflowY:"auto", maxHeight:260, padding:"8px 14px" }}>
        {currentLogs.length === 0 ? (
          <div style={{ color:C.textMuted, fontSize:12,
            textAlign:"center", padding:"20px 0" }}>
            No log entries yet
          </div>
        ) : currentLogs.map((entry, i) => (
          <div key={i} style={{ display:"flex", gap:8, padding:"5px 0",
            borderBottom: i < currentLogs.length - 1
              ? `1px solid ${C.borderLight}` : "none" }}>
            <span style={{ fontSize:13, flexShrink:0 }}>{logIcon(entry.type)}</span>
            <div style={{ flex:1, minWidth:0 }}>
              <span style={{ fontSize:12, color:C.text }}>
                {entry.data?.description || entry.type}
              </span>
              {entry.data?.playerName && (
                <span style={{ fontSize:11, color:C.textMuted, marginLeft:6 }}>
                  — {entry.data.playerName}
                </span>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── TiltsCatalogPanel ────────────────────────────────────────────────────

function TiltsCatalogPanel({ onClose }) {
  const catalog = TiltsCatalog.useCatalog();
  const [overwrite,  setOverwrite]  = useState(false);
  const [status,     setStatus]     = useState(null);   // { msg, type }
  const [progress,   setProgress]   = useState(null);   // { done, total }
  const fileRef = useRef(null);

  function onStatus(msg, type) { setStatus({ msg, type }); setProgress(null); }
  function onProgress(done, total) { setProgress({ done, total }); }

  const statusColor = !status ? C.textMuted
    : status.type === "ok"   ? C.success
    : status.type === "warn" ? C.warning
    : C.danger;

  return ReactDOM.createPortal(
    <div style={{ position:"fixed", inset:0, zIndex:10000,
      background:"rgba(0,0,0,0.6)", display:"flex", alignItems:"center",
      justifyContent:"center", padding:16 }}
      onMouseDown={e => { if (e.target === e.currentTarget) onClose(); }}>
      <div style={{ background:C.bgCard, border:`1px solid ${C.accentBorder}`,
        borderRadius:12, width:"100%", maxWidth:480, padding:20,
        boxShadow:"0 16px 48px rgba(0,0,0,0.7)" }}>

        {/* Header */}
        <div style={{ display:"flex", justifyContent:"space-between",
          alignItems:"center", marginBottom:16 }}>
          <span style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:14, fontWeight:700,
            letterSpacing:2, textTransform:"uppercase", color:C.accentLight }}>
            ⚙ Tilts Catalog
          </span>
          <span style={{ fontSize:12, color:C.textMuted }}>
            {catalog.length} entr{catalog.length === 1 ? "y" : "ies"} loaded
          </span>
        </div>

        {/* Import row */}
        <div style={{ background:C.bgDeep, border:`1px solid ${C.border}`,
          borderRadius:8, padding:12, marginBottom:10 }}>
          <div style={{ fontSize:11, color:C.textMuted, marginBottom:8,
            textTransform:"uppercase", letterSpacing:1 }}>Import CSV</div>
          <div style={{ display:"flex", gap:8, alignItems:"center", flexWrap:"wrap" }}>
            <input ref={fileRef} type="file" accept=".csv"
              style={{ display:"none" }}
              onChange={e => {
                TiltsCatalog.handleImportFile(e.target.files[0], overwrite, onStatus, onProgress);
                e.target.value = "";
              }} />
            <button onClick={() => fileRef.current && fileRef.current.click()}
              style={{ padding:"6px 14px", borderRadius:6, cursor:"pointer",
                border:`1px solid ${C.accentBorder}`, background:C.accentFaint,
                color:C.accentLight, fontSize:12, fontWeight:600 }}>
              Choose File…
            </button>
            <label style={{ display:"flex", alignItems:"center", gap:6,
              fontSize:12, color:C.textMuted, cursor:"pointer" }}>
              <input type="checkbox" checked={overwrite}
                onChange={e => setOverwrite(e.target.checked)} />
              Overwrite existing
            </label>
          </div>
          {progress && (
            <div style={{ marginTop:8 }}>
              <div style={{ height:4, borderRadius:2, background:C.border, overflow:"hidden" }}>
                <div style={{ height:"100%", borderRadius:2, background:C.accentLight,
                  width: `${Math.round((progress.done / progress.total) * 100)}%`,
                  transition:"width 0.2s" }} />
              </div>
              <div style={{ fontSize:10, color:C.textMuted, marginTop:4 }}>
                {progress.done} / {progress.total}
              </div>
            </div>
          )}
          {status && (
            <div style={{ marginTop:8, fontSize:11, color:statusColor,
              whiteSpace:"pre-wrap", wordBreak:"break-word" }}>
              {status.msg}
            </div>
          )}
        </div>

        {/* Template & Export row */}
        <div style={{ display:"flex", gap:8, marginBottom:16 }}>
          <button onClick={() => TiltsCatalog.downloadTemplate()}
            style={{ flex:1, padding:"7px 0", borderRadius:6, cursor:"pointer",
              border:`1px solid ${C.border}`, background:"transparent",
              color:C.textMuted, fontSize:12 }}>
            Download Template
          </button>
          <button onClick={() => TiltsCatalog.exportCsv(onStatus)}
            style={{ flex:1, padding:"7px 0", borderRadius:6, cursor:"pointer",
              border:`1px solid ${C.border}`, background:"transparent",
              color:C.textMuted, fontSize:12 }}>
            Export CSV
          </button>
        </div>

        <button onClick={onClose}
          style={{ width:"100%", padding:"8px 0", borderRadius:6, cursor:"pointer",
            border:`1px solid ${C.border}`, background:"transparent",
            color:C.textMuted, fontSize:12 }}>
          Close
        </button>
      </div>
    </div>,
    document.body
  );
}

// ── App ───────────────────────────────────────────────────────────────────

function App() {
  const [phase,          setPhase]          = useState("entry");
  const [sessionCode,    setSessionCode]    = useState("");
  const [inputCode,      setInputCode]      = useState("");
  const [stName,         setStName]         = useState("");
  const [error,          setError]          = useState("");
  const [players,        setPlayers]        = useState({});
  const [sceneActive,    setSceneActive]    = useState(false);
  const [sceneNumber,    setSceneNumber]    = useState(0);
  const [scenes,         setScenes]         = useState({});
  const [currentSceneId, setCurrentSceneId] = useState(null);
  const [catalogOpen,    setCatalogOpen]    = useState(false);
  const listenerRef = useRef(null);

  useEffect(() => { TiltsCatalog.subscribe(); }, []);

  // Reconnect from localStorage on mount
  useEffect(() => {
    const saved = sessionRecall();
    if (saved?.code && saved.role === "st") {
      sessionGetRef(saved.code).once("value").then(snap => {
        if (snap.exists() && !snap.val()?.meta?.closed) {
          setSessionCode(saved.code);
          attachListener(saved.code);
          setPhase("dashboard");
        } else {
          sessionForget();
        }
      }).catch(() => sessionForget());
    }
    return () => detachListener();
  }, []);

  function attachListener(code) {
    detachListener();
    const ref = sessionGetRef(code);
    const cb  = ref.on("value", snap => {
      const data = snap.val();
      if (!data || data.meta?.closed) {
        detachListener();
        sessionForget();
        setPhase("entry");
        setError("Session was closed.");
        return;
      }
      setSceneActive(!!data.sceneActive);
      setSceneNumber(data.sceneNumber || 0);
      setPlayers(data.players || {});
      setScenes(data.scenes   || {});
      setCurrentSceneId(data.currentSceneId || null);
    });
    listenerRef.current = { ref, cb };
  }

  function detachListener() {
    if (listenerRef.current) {
      listenerRef.current.ref.off("value", listenerRef.current.cb);
      listenerRef.current = null;
    }
  }

  function handleCreate() {
    const code = sessionGenerateCode();
    setError("");
    sessionCreate(code, stName || "Storyteller")
      .then(() => {
        setSessionCode(code);
        attachListener(code);
        sessionRemember(code, "st");
        setPhase("dashboard");
      })
      .catch(e => setError("Failed to create session: " + e.message));
  }

  function handleJoin() {
    const code = inputCode.trim().toUpperCase();
    if (code.length < 3) { setError("Enter a valid session code"); return; }
    setError("");
    sessionGetRef(code).once("value")
      .then(snap => {
        if (!snap.exists() || snap.val()?.meta?.closed) {
          setError("Session not found or already closed.");
          return;
        }
        setSessionCode(code);
        attachListener(code);
        sessionRemember(code, "st");
        setPhase("dashboard");
      })
      .catch(e => setError("Failed to join: " + e.message));
  }

  function handleToggleScene() {
    if (sceneActive) {
      sessionEndScene(sessionCode).then(() => sessionResetAllPlayers(sessionCode));
    } else {
      sessionStartScene(sessionCode).then(() => sessionResetAllPlayers(sessionCode));
    }
  }

  function handleCloseSession() {
    if (!window.confirm("Close this session for all players?")) return;
    sessionGetRef(sessionCode).update({ "meta/closed": true, sceneActive: false });
    setTimeout(() => sessionGetRef(sessionCode).remove(), 5000);
    detachListener();
    sessionForget();
    setPhase("entry");
    setSessionCode("");
    setPlayers({});
    setSceneActive(false);
    setScenes({});
  }

  const playerEntries = Object.entries(players);
  const hasScenes     = Object.keys(scenes).length > 0;

  // ── Entry screen ────────────────────────────────────────────────────────

  if (phase === "entry") {
    return (
      <div style={{ minHeight:"100vh", display:"flex", alignItems:"center",
        justifyContent:"center", padding:24, background:C.bgDark }}>
        <div style={{ width:"100%", maxWidth:420 }}>

          <div style={{ textAlign:"center", marginBottom:32 }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:28, fontWeight:700,
              letterSpacing:3, textTransform:"uppercase", color:C.accentLight }}>
              Storyteller Screen
            </div>
            <div style={{ color:C.textMuted, fontSize:13, marginTop:6 }}>
              Mage: The Awakening 2e
            </div>
          </div>

          {error && (
            <div style={{ padding:"8px 12px", borderRadius:8, marginBottom:16,
              background:C.dangerFaint, border:`1px solid ${C.danger}` }}>
              <span style={{ color:C.danger, fontSize:12 }}>{error}</span>
            </div>
          )}

          {/* Create new session */}
          <div style={{ background:C.bgCard, borderRadius:12, padding:20,
            border:`1px solid ${C.accentBorder}`, marginBottom:12 }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,
              letterSpacing:1.5, textTransform:"uppercase", color:C.accentLight,
              marginBottom:12 }}>
              New Session
            </div>
            <input value={stName} onChange={e => setStName(e.target.value)}
              placeholder="Your name (optional)"
              style={{ width:"100%", padding:"9px 12px", borderRadius:8,
                background:C.bgDeep, border:`1px solid ${C.border}`,
                color:C.text, fontSize:13, outline:"none", marginBottom:10 }} />
            <button onClick={handleCreate}
              style={{ width:"100%", padding:12, borderRadius:8, cursor:"pointer",
                border:"none", background:C.accent, color:"#fff",
                fontSize:14, fontWeight:700 }}>
              Create Session
            </button>
          </div>

          {/* Rejoin existing */}
          <div style={{ background:C.bgCard, borderRadius:12, padding:20,
            border:`1px solid ${C.border}` }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,
              letterSpacing:1.5, textTransform:"uppercase", color:C.textMuted,
              marginBottom:12 }}>
              Rejoin Session
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <input value={inputCode}
                onChange={e => setInputCode(e.target.value.toUpperCase())}
                maxLength={6} placeholder="CODE"
                style={{ flex:1, textAlign:"center", fontFamily:"monospace",
                  fontSize:22, letterSpacing:6, padding:"8px 10px", borderRadius:8,
                  background:C.bgDeep, border:`1px solid ${C.border}`,
                  color:C.text, outline:"none", textTransform:"uppercase" }} />
              <button onClick={handleJoin}
                style={{ padding:"8px 20px", borderRadius:8, cursor:"pointer",
                  border:"none", background:C.success, color:"#fff",
                  fontSize:14, fontWeight:700 }}>
                Join
              </button>
            </div>
          </div>

        </div>
      </div>
    );
  }

  // ── Dashboard ───────────────────────────────────────────────────────────

  return (
    <div style={{ display:"flex", flexDirection:"column", minHeight:"100vh",
      background:C.bgDark }}>

      {/* Header bar */}
      <div style={{ padding:"10px 20px", borderBottom:`1px solid ${C.accentBorder}`,
        background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})`,
        display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", flexShrink:0 }}>

        <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:16, fontWeight:700,
          letterSpacing:2, textTransform:"uppercase", color:C.accentLight }}>
          ST Screen
        </div>

        {/* Session code */}
        <div style={{ background:C.bgDeep, borderRadius:6, padding:"3px 12px",
          border:`1px solid ${C.accentBorder}`, display:"flex",
          alignItems:"center", gap:8 }}>
          <span style={{ fontFamily:"monospace", fontSize:15, fontWeight:700,
            letterSpacing:5, color:C.accentLight }}>
            {sessionCode}
          </span>
          <span style={{ fontSize:10, color:C.textMuted }}>
            {playerEntries.length} player{playerEntries.length !== 1 ? "s" : ""}
          </span>
        </div>

        {/* Scene status */}
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ width:7, height:7, borderRadius:"50%", flexShrink:0,
            background: sceneActive ? C.success : C.textMuted }} />
          <span style={{ fontSize:12,
            color: sceneActive ? C.success : C.textMuted }}>
            {sceneActive ? `Scene ${sceneNumber} active` : "No active scene"}
          </span>
        </div>

        <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
          <button onClick={() => setCatalogOpen(true)}
            style={{ padding:"6px 14px", borderRadius:7, cursor:"pointer",
              border:`1px solid ${C.accentBorder}`, background:C.accentFaint,
              color:C.accentLight, fontSize:12 }}>
            ⚙ Tilts Catalog
          </button>
          <button onClick={handleToggleScene}
            style={{ padding:"6px 18px", borderRadius:7, cursor:"pointer",
              border:"none", fontSize:12, fontWeight:700,
              background: sceneActive ? C.danger : C.success, color:"#fff" }}>
            {sceneActive ? "End Scene" : "Start Scene"}
          </button>
          <button onClick={handleCloseSession}
            style={{ padding:"6px 14px", borderRadius:7, cursor:"pointer",
              background:"transparent", border:`1px solid ${C.danger}`,
              color:C.danger, fontSize:12 }}>
            Close Session
          </button>
        </div>
        {catalogOpen && <TiltsCatalogPanel onClose={() => setCatalogOpen(false)} />}
      </div>

      {/* Scrollable content */}
      <div style={{ flex:1, overflowY:"auto", padding:16 }}>
        {playerEntries.length === 0 ? (
          <div style={{ textAlign:"center", padding:"64px 24px", color:C.textMuted }}>
            <div style={{ fontSize:36, marginBottom:14 }}>🎭</div>
            <div style={{ fontSize:15, fontWeight:600, color:C.text }}>
              Waiting for players…
            </div>
            <div style={{ fontSize:13, marginTop:8 }}>
              Share code{" "}
              <span style={{ fontFamily:"monospace", color:C.accentLight, letterSpacing:4 }}>
                {sessionCode}
              </span>{" "}
              with your players
            </div>
          </div>
        ) : (
          <div className="player-grid" style={{ marginBottom:16 }}>
            {playerEntries.map(([pid, player]) => (
              <PlayerCard
                key={pid}
                pid={pid}
                player={player}
                sessionCode={sessionCode}
                sceneActive={sceneActive}
              />
            ))}
          </div>
        )}

        {/* Scene log — only shown once a scene has started */}
        {hasScenes && (
          <SceneLog
            sessionCode={sessionCode}
            scenes={scenes}
            currentSceneId={currentSceneId}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
