    *  { box-sizing:border-box; margin:0; padding:0; }

    color: #9d4edd; background: rgba(123,44,191,0.15); text-decoration: none;">Storyteller</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin></script>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── Colour palette (matches wizard.html) ─────────────────────────────────
const C = {
  bgDark:       "#0d0d1a",
  bgDeep:       "#080812",
  bgCard:       "#13131f",
  text:         "#e0e0e0",
  textMuted:    "#8888aa",
  accent:       "#7b2cbf",
  accentLight:  "#a855f7",
  accentBorder: "rgba(123,44,191,0.35)",
  accentFaint:  "rgba(123,44,191,0.12)",
  border:       "rgba(255,255,255,0.08)",
  borderLight:  "rgba(255,255,255,0.04)",
  danger:       "#c73e1d",
  dangerFaint:  "rgba(199,62,29,0.15)",
  warning:      "#e9c46a",
  warningFaint: "rgba(233,196,106,0.12)",
  success:      "#2a9d8f",
  successFaint: "rgba(42,157,143,0.15)",
};

const ARCANUM_HEX = {
  death:"#475569", fate:"#e2e8f0", forces:"#f87171", life:"#4ade80",
  matter:"#d97706", mind:"#fbbf24", prime:"#60a5fa", space:"#a78bfa",
  spirit:"#fb923c", time:"#22d3ee",
};

// ── Tiny shared components ────────────────────────────────────────────────

function FieldLabel({ children }) {
  return (
    <div style={{ fontSize:9, letterSpacing:1.5, textTransform:"uppercase",
      color:C.textMuted, marginBottom:3 }}>
      {children}
    </div>
  );
}

function Stepper({ value, min=0, max=99, onChange, color }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:4 }}>
      <button onClick={() => onChange(Math.max(min, value - 1))}
        style={{ width:24, height:24, borderRadius:4, cursor:"pointer",
          border:`1px solid ${C.border}`, background:C.bgDeep,
          color:C.textMuted, fontSize:15, lineHeight:1,
          display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>
        −
      </button>
      <span style={{ minWidth:22, textAlign:"center", fontSize:14,
        fontWeight:700, color: color || C.text }}>
        {value}
      </span>
      <button onClick={() => onChange(Math.min(max, value + 1))}
        style={{ width:24, height:24, borderRadius:4, cursor:"pointer",
          border:`1px solid ${C.border}`, background:C.bgDeep,
          color:C.textMuted, fontSize:15, lineHeight:1,
          display:"flex", alignItems:"center", justifyContent:"center", padding:0 }}>
        +
      </button>
    </div>
  );
}

// ── PlayerCard ────────────────────────────────────────────────────────────

function PlayerCard({ pid, player, sessionCode, sceneActive }) {
  const [spellsOpen,   setSpellsOpen]   = useState(false);
  const [tiltInput,    setTiltInput]    = useState("");
  const [sheetInput,   setSheetInput]   = useState(player.sheetLink || "");
  const [sheetEditing, setSheetEditing] = useState(false);

  // Keep sheetInput in sync when player.sheetLink changes externally
  useEffect(() => {
    if (!sheetEditing) setSheetInput(player.sheetLink || "");
  }, [player.sheetLink, sheetEditing]);

  const s      = player.stats  || {};
  const h      = s.health      || { max:7, bashing:0, lethal:0, aggravated:0 };
  const m      = s.mana        || { current:0, max:10 };
  const wp     = s.willpower   || { current:5, max:5 };
  const spells = Array.isArray(s.activeSpells) ? s.activeSpells : [];
  const tilts  = Array.isArray(player.tilts)   ? player.tilts   : [];

  const paradoxRolls = player.paradoxRolls || 0;
  const stAdj        = player.stAdjustment  || 0;
  const effectiveDox = Math.max(0, paradoxRolls + stAdj);

  // ── Stat writers ───────────────────────────────────────────────────────

  function pushStatEdit(partial) {
    sessionSTEditStats(sessionCode, pid, partial);
  }

  function setHealthType(type, val) {
    const next = {
      max:        h.max,
      bashing:    h.bashing    || 0,
      lethal:     h.lethal     || 0,
      aggravated: h.aggravated || 0,
      [type]: Math.max(0, val),
    };
    // Cap total at max
    const sum = next.aggravated + next.lethal + next.bashing;
    if (sum > next.max) next[type] = Math.max(0, next[type] - (sum - next.max));
    pushStatEdit({ health: next });
  }

  function setMana(val) {
    pushStatEdit({ mana: { current: Math.max(0, Math.min(m.max, val)), max: m.max } });
  }

  function setWillpower(val) {
    pushStatEdit({ willpower: { current: Math.max(0, Math.min(wp.max, val)), max: wp.max } });
  }

  function setParadoxAdj(delta) {
    sessionSetAdjustment(sessionCode, pid, stAdj + delta, player.stNote || "");
  }

  // ── Tilts ──────────────────────────────────────────────────────────────

  function addTilt() {
    const t = tiltInput.trim();
    if (!t) return;
    sessionSetTilts(sessionCode, pid, [...tilts, t]);
    setTiltInput("");
  }

  function removeTilt(i) {
    sessionSetTilts(sessionCode, pid, tilts.filter((_, idx) => idx !== i));
  }

  // ── Sheet link ─────────────────────────────────────────────────────────

  function saveSheetLink() {
    sessionSetSheetLink(sessionCode, pid, sheetInput.trim());
    setSheetEditing(false);
  }

  // ── Health track ───────────────────────────────────────────────────────

  const shFilled = (h.aggravated || 0) + (h.lethal || 0) + (h.bashing || 0);
  const shWound  = shFilled >= h.max ? -3
                 : shFilled >= h.max - 1 ? -2
                 : shFilled >= h.max - 2 ? -1 : 0;

  function healthBoxStyle(i) {
    if (i < (h.aggravated || 0))
      return { sym:"✦", bg:"rgba(199,62,29,0.25)", fg:C.danger,   bd:C.danger   };
    if (i < (h.aggravated || 0) + (h.lethal || 0))
      return { sym:"✕", bg:"rgba(233,196,106,0.18)", fg:C.warning, bd:C.warning };
    if (i < shFilled)
      return { sym:"/",  bg:C.bgCard,              fg:C.text,    bd:C.borderLight };
    return   { sym:"",   bg:C.bgDeep,              fg:C.textMuted, bd:C.border  };
  }

  const doxColor = effectiveDox >= 5 ? C.danger
                 : effectiveDox >= 3 ? C.warning
                 : C.text;

  // ── Render ─────────────────────────────────────────────────────────────

  return (
    <div style={{ background:C.bgCard, border:`1px solid ${C.accentBorder}`,
      borderRadius:12, overflow:"hidden" }}>

      {/* ── Header ── */}
      <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`,
        background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})`,
        display:"flex", alignItems:"center", justifyContent:"space-between", gap:8 }}>
        <div style={{ minWidth:0 }}>
          <span style={{ fontSize:14, fontWeight:700, color:C.text }}>
            {player.name || pid}
          </span>
          {player.path && (
            <span style={{ fontSize:11, color:C.accentLight, marginLeft:6 }}>
              {player.path}
            </span>
          )}
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:6, flexShrink:0 }}>
          {player.sheetLink && !sheetEditing && (
            <a href={player.sheetLink} target="_blank" rel="noopener noreferrer"
              style={{ fontSize:11, padding:"3px 9px", borderRadius:5,
                background:C.accentFaint, border:`1px solid ${C.accentBorder}`,
                color:C.accentLight, textDecoration:"none" }}>
              Sheet ↗
            </a>
          )}
          <button
            onClick={() => { setSheetEditing(e => !e); setSheetInput(player.sheetLink || ""); }}
            style={{ fontSize:10, padding:"3px 8px", borderRadius:5, cursor:"pointer",
              background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted }}>
            {sheetEditing ? "Cancel" : player.sheetLink ? "Edit" : "+ Sheet"}
          </button>
        </div>
      </div>

      {/* ── Sheet link editor ── */}
      {sheetEditing && (
        <div style={{ padding:"8px 14px", borderBottom:`1px solid ${C.border}`,
          background:"rgba(123,44,191,0.06)", display:"flex", gap:6 }}>
          <input value={sheetInput} onChange={e => setSheetInput(e.target.value)}
            placeholder="https://docs.google.com/…"
            style={{ flex:1, padding:"5px 8px", borderRadius:6, fontSize:11,
              background:C.bgDeep, border:`1px solid ${C.accentBorder}`,
              color:C.text, outline:"none" }} />
          <button onClick={saveSheetLink}
            style={{ padding:"5px 12px", borderRadius:6, cursor:"pointer",
              border:"none", background:C.accent, color:"#fff",
              fontSize:11, fontWeight:700 }}>
            Save
          </button>
        </div>
      )}

      <div style={{ padding:"12px 14px" }}>

        {/* ── Paradox ── */}
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between",
          marginBottom:10, padding:"7px 10px", borderRadius:7,
          background: effectiveDox > 0 ? C.dangerFaint : C.bgDeep,
          border:`1px solid ${effectiveDox > 0 ? "rgba(199,62,29,0.3)" : C.border}` }}>
          <div>
            <FieldLabel>Paradox</FieldLabel>
            <span style={{ fontSize:22, fontWeight:700, color:doxColor, lineHeight:1 }}>
              {effectiveDox}
            </span>
            {stAdj !== 0 && (
              <span style={{ fontSize:11, color:C.textMuted, marginLeft:7 }}>
                ({paradoxRolls} + {stAdj >= 0 ? "+" : ""}{stAdj} ST)
              </span>
            )}
            {player.stNote ? (
              <div style={{ fontSize:10, color:C.warning, marginTop:2 }}>{player.stNote}</div>
            ) : null}
          </div>
          {sceneActive && (
            <div style={{ display:"flex", gap:4 }}>
              <button onClick={() => setParadoxAdj(-1)}
                style={{ width:28, height:28, borderRadius:5, cursor:"pointer",
                  border:`1px solid ${C.border}`, background:C.bgCard,
                  color:C.text, fontSize:16 }}>−</button>
              <button onClick={() => setParadoxAdj(1)}
                style={{ width:28, height:28, borderRadius:5, cursor:"pointer",
                  border:`1px solid ${C.border}`, background:C.bgCard,
                  color:C.text, fontSize:16 }}>+</button>
            </div>
          )}
        </div>

        {/* ── Health track ── */}
        <div style={{ marginBottom:10 }}>
          <div style={{ display:"flex", justifyContent:"space-between",
            alignItems:"center", marginBottom:4 }}>
            <FieldLabel>Health</FieldLabel>
            {shWound < 0 && (
              <span style={{ fontSize:9, color:C.danger }}>Wound {shWound}</span>
            )}
          </div>
          {/* Visual track */}
          <div style={{ display:"flex", gap:2, marginBottom:6 }}>
            {Array.from({ length: h.max || 7 }).map((_, i) => {
              const { sym, bg, fg, bd } = healthBoxStyle(i);
              return (
                <div key={i} style={{ flex:1, textAlign:"center", padding:"3px 0",
                  borderRadius:3, background:bg, border:`1px solid ${bd}`,
                  fontSize:10, fontWeight:700, color:fg, minWidth:0 }}>
                  {sym || "\u00A0"}
                </div>
              );
            })}
          </div>
          {/* Per-type steppers */}
          <div style={{ display:"flex", gap:6 }}>
            {[["✦ Agg", "aggravated", C.danger],
              ["✕ Let", "lethal",     C.warning],
              ["/ Bash","bashing",    C.text]
            ].map(([label, type, color]) => (
              <div key={type} style={{ flex:1, textAlign:"center" }}>
                <div style={{ fontSize:9, color:C.textMuted, marginBottom:3 }}>{label}</div>
                <Stepper
                  value={h[type] || 0}
                  max={h.max || 7}
                  onChange={v => setHealthType(type, v)}
                  color={color}
                />
              </div>
            ))}
          </div>
        </div>

        {/* ── Mana & Willpower ── */}
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:10 }}>
          <div style={{ padding:"8px 10px", borderRadius:7,
            background:C.bgDeep, border:`1px solid ${C.border}` }}>
            <FieldLabel>Mana</FieldLabel>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <Stepper
                value={m.current ?? 0}
                max={m.max ?? 10}
                onChange={setMana}
                color={m.current < 3 ? C.danger : m.current < (m.max / 2) ? C.warning : C.text}
              />
              <span style={{ fontSize:11, color:C.textMuted }}>/ {m.max ?? 10}</span>
            </div>
          </div>
          <div style={{ padding:"8px 10px", borderRadius:7,
            background:C.bgDeep, border:`1px solid ${C.border}` }}>
            <FieldLabel>Willpower</FieldLabel>
            <div style={{ display:"flex", alignItems:"center", gap:6 }}>
              <Stepper
                value={wp.current ?? 5}
                max={wp.max ?? 5}
                onChange={setWillpower}
                color={wp.current < 2 ? C.danger : C.text}
              />
              <span style={{ fontSize:11, color:C.textMuted }}>/ {wp.max ?? 5}</span>
            </div>
          </div>
        </div>

        {/* ── Active Spells ── */}
        <div style={{ marginBottom:10 }}>
          <button onClick={() => setSpellsOpen(o => !o)}
            style={{ width:"100%", display:"flex", alignItems:"center",
              justifyContent:"space-between", padding:"7px 10px", borderRadius:7,
              background:C.bgDeep, border:`1px solid ${C.border}`,
              color:C.text, cursor:"pointer", fontSize:12 }}>
            <span style={{ fontWeight:600 }}>
              ⚡ Active Spells
              <span style={{ marginLeft:7, fontSize:11,
                color: spells.length > 0 ? C.accentLight : C.textMuted }}>
                {spells.length} / {s.maxActiveSpells || s.gnosis || 1}
              </span>
            </span>
            <span style={{ color:C.textMuted, fontSize:10 }}>
              {spellsOpen ? "▲" : "▼"}
            </span>
          </button>
          {spellsOpen && (
            <div style={{ marginTop:4, borderRadius:7,
              border:`1px solid ${C.border}`, overflow:"hidden" }}>
              {spells.length === 0 ? (
                <div style={{ padding:"10px 12px", fontSize:11,
                  color:C.textMuted, textAlign:"center" }}>
                  No active spells
                </div>
              ) : spells.map((sp, i) => {
                const arc      = (sp.arcanum || "prime").toLowerCase();
                const dotColor = ARCANUM_HEX[arc] || C.accentLight;
                const dots     = "●".repeat(Math.min(sp.arcanumLevel || 1, 5));
                return (
                  <div key={sp.id || i}
                    style={{ padding:"8px 12px",
                      borderBottom: i < spells.length - 1
                        ? `1px solid ${C.borderLight}` : "none",
                      background: i % 2 === 0 ? C.bgDeep : "transparent" }}>
                    <div style={{ fontWeight:600, fontSize:13, color:C.text }}>
                      {sp.name}
                    </div>
                    <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>
                      <span style={{ color:dotColor }}>
                        {arc.charAt(0).toUpperCase() + arc.slice(1)} {dots}
                      </span>
                      {" · "}Pot {sp.potency}
                      {" · "}{sp.duration}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── Tilts & Conditions ── */}
        <div>
          <FieldLabel>Tilts &amp; Conditions</FieldLabel>
          <div style={{ display:"flex", flexWrap:"wrap", gap:4, marginBottom:6,
            minHeight: tilts.length > 0 ? "auto" : 0 }}>
            {tilts.map((t, i) => (
              <span key={i} style={{ display:"inline-flex", alignItems:"center", gap:4,
                padding:"3px 8px", borderRadius:20, fontSize:11,
                background:C.warningFaint,
                border:`1px solid rgba(233,196,106,0.3)`,
                color:C.warning }}>
                {t}
                <button onClick={() => removeTilt(i)}
                  style={{ background:"transparent", border:"none",
                    color:C.warning, cursor:"pointer", fontSize:13,
                    lineHeight:1, padding:0, opacity:0.7 }}>
                  ×
                </button>
              </span>
            ))}
            {tilts.length === 0 && (
              <span style={{ fontSize:11, color:C.textMuted }}>None</span>
            )}
          </div>
          <div style={{ display:"flex", gap:6 }}>
            <input
              value={tiltInput}
              onChange={e => setTiltInput(e.target.value)}
              onKeyDown={e => e.key === "Enter" && addTilt()}
              placeholder="Add tilt or condition…"
              style={{ flex:1, padding:"5px 8px", borderRadius:6, fontSize:11,
                background:C.bgDeep, border:`1px solid ${C.border}`,
                color:C.text, outline:"none" }}
            />
            <button onClick={addTilt}
              style={{ padding:"5px 12px", borderRadius:6, cursor:"pointer",
                border:`1px solid ${C.accentBorder}`, background:C.accentFaint,
                color:C.accentLight, fontSize:13, fontWeight:700 }}>
              +
            </button>
          </div>
        </div>

      </div>
    </div>
  );
}

// ── SceneLog ──────────────────────────────────────────────────────────────

function SceneLog({ sessionCode, scenes, currentSceneId }) {
  const [openSceneId, setOpenSceneId] = useState(currentSceneId);
  const [logs, setLogs] = useState({});

  useEffect(() => { setOpenSceneId(currentSceneId); }, [currentSceneId]);

  useEffect(() => {
    if (!sessionCode || !openSceneId) return;
    const ref = sessionGetRef(sessionCode).child("scenes/" + openSceneId + "/log");
    const cb  = ref.on("value", snap => {
      const raw = snap.val() || {};
      setLogs(prev => ({
        ...prev,
        [openSceneId]: Object.values(raw).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)),
      }));
    });
    return () => ref.off("value", cb);
  }, [sessionCode, openSceneId]);

  const sceneList = Object.entries(scenes || {})
    .sort((a, b) => (a[1].number || 0) - (b[1].number || 0));

  const currentLogs = logs[openSceneId] || [];

  const logIcon = type => ({
    paradox:     "🎲",
    spell:       "⚡",
    tilt:        "⚠️",
    stat_change: "✏️",
    note:        "📝",
  })[type] || "•";

  return (
    <div style={{ background:C.bgCard, border:`1px solid ${C.border}`,
      borderRadius:12, overflow:"hidden" }}>
      <div style={{ padding:"10px 14px", borderBottom:`1px solid ${C.border}`,
        background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})` }}>
        <span style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,
          letterSpacing:2, textTransform:"uppercase", color:C.accentLight }}>
          Session Log
        </span>
      </div>

      {/* Scene selector tabs */}
      {sceneList.length > 0 && (
        <div style={{ display:"flex", gap:4, padding:"8px 14px",
          borderBottom:`1px solid ${C.border}`, flexWrap:"wrap" }}>
          {sceneList.map(([sid, sc]) => (
            <button key={sid} onClick={() => setOpenSceneId(sid)}
              style={{ padding:"3px 10px", borderRadius:20, cursor:"pointer", fontSize:11,
                border:`1px solid ${sid === openSceneId ? C.accentBorder : C.border}`,
                background: sid === openSceneId ? C.accentFaint : "transparent",
                color: sid === openSceneId ? C.accentLight : C.textMuted,
                fontWeight: sid === currentSceneId ? 700 : 400 }}>
              Scene {sc.number || "—"}
              {sid === currentSceneId && sc.active ? " ●" : ""}
            </button>
          ))}
        </div>
      )}

      {/* Log entries */}
      <div style={{ overflowY:"auto", maxHeight:260, padding:"8px 14px" }}>
        {currentLogs.length === 0 ? (
          <div style={{ color:C.textMuted, fontSize:12,
            textAlign:"center", padding:"20px 0" }}>
            No log entries yet
          </div>
        ) : currentLogs.map((entry, i) => (
          <div key={i} style={{ display:"flex", gap:8, padding:"5px 0",
            borderBottom: i < currentLogs.length - 1
              ? `1px solid ${C.borderLight}` : "none" }}>
            <span style={{ fontSize:13, flexShrink:0 }}>{logIcon(entry.type)}</span>
            <div style={{ flex:1, minWidth:0 }}>
              <span style={{ fontSize:12, color:C.text }}>
                {entry.data?.description || entry.type}
              </span>
              {entry.data?.playerName && (
                <span style={{ fontSize:11, color:C.textMuted, marginLeft:6 }}>
                  — {entry.data.playerName}
                </span>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────

function App() {
  const [phase,          setPhase]          = useState("entry");
  const [sessionCode,    setSessionCode]    = useState("");
  const [inputCode,      setInputCode]      = useState("");
  const [stName,         setStName]         = useState("");
  const [error,          setError]          = useState("");
  const [players,        setPlayers]        = useState({});
  const [sceneActive,    setSceneActive]    = useState(false);
  const [sceneNumber,    setSceneNumber]    = useState(0);
  const [scenes,         setScenes]         = useState({});
  const [currentSceneId, setCurrentSceneId] = useState(null);
  const listenerRef = useRef(null);

  // Reconnect from localStorage on mount
  useEffect(() => {
    const saved = sessionRecall();
    if (saved?.code && saved.role === "st") {
      sessionGetRef(saved.code).once("value").then(snap => {
        if (snap.exists() && !snap.val()?.meta?.closed) {
          setSessionCode(saved.code);
          attachListener(saved.code);
          setPhase("dashboard");
        } else {
          sessionForget();
        }
      }).catch(() => sessionForget());
    }
    return () => detachListener();
  }, []);

  function attachListener(code) {
    detachListener();
    const ref = sessionGetRef(code);
    const cb  = ref.on("value", snap => {
      const data = snap.val();
      if (!data || data.meta?.closed) {
        detachListener();
        sessionForget();
        setPhase("entry");
        setError("Session was closed.");
        return;
      }
      setSceneActive(!!data.sceneActive);
      setSceneNumber(data.sceneNumber || 0);
      setPlayers(data.players || {});
      setScenes(data.scenes   || {});
      setCurrentSceneId(data.currentSceneId || null);
    });
    listenerRef.current = { ref, cb };
  }

  function detachListener() {
    if (listenerRef.current) {
      listenerRef.current.ref.off("value", listenerRef.current.cb);
      listenerRef.current = null;
    }
  }

  function handleCreate() {
    const code = sessionGenerateCode();
    setError("");
    sessionCreate(code, stName || "Storyteller")
      .then(() => {
        setSessionCode(code);
        attachListener(code);
        sessionRemember(code, "st");
        setPhase("dashboard");
      })
      .catch(e => setError("Failed to create session: " + e.message));
  }

  function handleJoin() {
    const code = inputCode.trim().toUpperCase();
    if (code.length < 3) { setError("Enter a valid session code"); return; }
    setError("");
    sessionGetRef(code).once("value")
      .then(snap => {
        if (!snap.exists() || snap.val()?.meta?.closed) {
          setError("Session not found or already closed.");
          return;
        }
        setSessionCode(code);
        attachListener(code);
        sessionRemember(code, "st");
        setPhase("dashboard");
      })
      .catch(e => setError("Failed to join: " + e.message));
  }

  function handleToggleScene() {
    if (sceneActive) {
      sessionEndScene(sessionCode).then(() => sessionResetAllPlayers(sessionCode));
    } else {
      sessionStartScene(sessionCode).then(() => sessionResetAllPlayers(sessionCode));
    }
  }

  function handleCloseSession() {
    if (!window.confirm("Close this session for all players?")) return;
    sessionGetRef(sessionCode).update({ "meta/closed": true, sceneActive: false });
    setTimeout(() => sessionGetRef(sessionCode).remove(), 5000);
    detachListener();
    sessionForget();
    setPhase("entry");
    setSessionCode("");
    setPlayers({});
    setSceneActive(false);
    setScenes({});
  }

  const playerEntries = Object.entries(players);
  const hasScenes     = Object.keys(scenes).length > 0;

  // ── Entry screen ────────────────────────────────────────────────────────

  if (phase === "entry") {
    return (
      <div style={{ minHeight:"100vh", display:"flex", alignItems:"center",
        justifyContent:"center", padding:24, background:C.bgDark }}>
        <div style={{ width:"100%", maxWidth:420 }}>

          <div style={{ textAlign:"center", marginBottom:32 }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:28, fontWeight:700,
              letterSpacing:3, textTransform:"uppercase", color:C.accentLight }}>
              Storyteller Screen
            </div>
            <div style={{ color:C.textMuted, fontSize:13, marginTop:6 }}>
              Mage: The Awakening 2e
            </div>
          </div>

          {error && (
            <div style={{ padding:"8px 12px", borderRadius:8, marginBottom:16,
              background:C.dangerFaint, border:`1px solid ${C.danger}` }}>
              <span style={{ color:C.danger, fontSize:12 }}>{error}</span>
            </div>
          )}

          {/* Create new session */}
          <div style={{ background:C.bgCard, borderRadius:12, padding:20,
            border:`1px solid ${C.accentBorder}`, marginBottom:12 }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,
              letterSpacing:1.5, textTransform:"uppercase", color:C.accentLight,
              marginBottom:12 }}>
              New Session
            </div>
            <input value={stName} onChange={e => setStName(e.target.value)}
              placeholder="Your name (optional)"
              style={{ width:"100%", padding:"9px 12px", borderRadius:8,
                background:C.bgDeep, border:`1px solid ${C.border}`,
                color:C.text, fontSize:13, outline:"none", marginBottom:10 }} />
            <button onClick={handleCreate}
              style={{ width:"100%", padding:12, borderRadius:8, cursor:"pointer",
                border:"none", background:C.accent, color:"#fff",
                fontSize:14, fontWeight:700 }}>
              Create Session
            </button>
          </div>

          {/* Rejoin existing */}
          <div style={{ background:C.bgCard, borderRadius:12, padding:20,
            border:`1px solid ${C.border}` }}>
            <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,
              letterSpacing:1.5, textTransform:"uppercase", color:C.textMuted,
              marginBottom:12 }}>
              Rejoin Session
            </div>
            <div style={{ display:"flex", gap:8 }}>
              <input value={inputCode}
                onChange={e => setInputCode(e.target.value.toUpperCase())}
                maxLength={6} placeholder="CODE"
                style={{ flex:1, textAlign:"center", fontFamily:"monospace",
                  fontSize:22, letterSpacing:6, padding:"8px 10px", borderRadius:8,
                  background:C.bgDeep, border:`1px solid ${C.border}`,
                  color:C.text, outline:"none", textTransform:"uppercase" }} />
              <button onClick={handleJoin}
                style={{ padding:"8px 20px", borderRadius:8, cursor:"pointer",
                  border:"none", background:C.success, color:"#fff",
                  fontSize:14, fontWeight:700 }}>
                Join
              </button>
            </div>
          </div>

        </div>
      </div>
    );
  }

  // ── Dashboard ───────────────────────────────────────────────────────────

  return (
    <div style={{ display:"flex", flexDirection:"column", minHeight:"100vh",
      background:C.bgDark }}>

      {/* Header bar */}
      <div style={{ padding:"10px 20px", borderBottom:`1px solid ${C.accentBorder}`,
        background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})`,
        display:"flex", alignItems:"center", gap:12, flexWrap:"wrap", flexShrink:0 }}>

        <div style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:16, fontWeight:700,
          letterSpacing:2, textTransform:"uppercase", color:C.accentLight }}>
          ST Screen
        </div>

        {/* Session code */}
        <div style={{ background:C.bgDeep, borderRadius:6, padding:"3px 12px",
          border:`1px solid ${C.accentBorder}`, display:"flex",
          alignItems:"center", gap:8 }}>
          <span style={{ fontFamily:"monospace", fontSize:15, fontWeight:700,
            letterSpacing:5, color:C.accentLight }}>
            {sessionCode}
          </span>
          <span style={{ fontSize:10, color:C.textMuted }}>
            {playerEntries.length} player{playerEntries.length !== 1 ? "s" : ""}
          </span>
        </div>

        {/* Scene status */}
        <div style={{ display:"flex", alignItems:"center", gap:6 }}>
          <span style={{ width:7, height:7, borderRadius:"50%", flexShrink:0,
            background: sceneActive ? C.success : C.textMuted }} />
          <span style={{ fontSize:12,
            color: sceneActive ? C.success : C.textMuted }}>
            {sceneActive ? `Scene ${sceneNumber} active` : "No active scene"}
          </span>
        </div>

        <div style={{ marginLeft:"auto", display:"flex", gap:8, alignItems:"center" }}>
          <button onClick={handleToggleScene}
            style={{ padding:"6px 18px", borderRadius:7, cursor:"pointer",
              border:"none", fontSize:12, fontWeight:700,
              background: sceneActive ? C.danger : C.success, color:"#fff" }}>
            {sceneActive ? "End Scene" : "Start Scene"}
          </button>
          <button onClick={handleCloseSession}
            style={{ padding:"6px 14px", borderRadius:7, cursor:"pointer",
              background:"transparent", border:`1px solid ${C.danger}`,
              color:C.danger, fontSize:12 }}>
            Close Session
          </button>
        </div>
      </div>

      {/* Scrollable content */}
      <div style={{ flex:1, overflowY:"auto", padding:16 }}>
        {playerEntries.length === 0 ? (
          <div style={{ textAlign:"center", padding:"64px 24px", color:C.textMuted }}>
            <div style={{ fontSize:36, marginBottom:14 }}>🎭</div>
            <div style={{ fontSize:15, fontWeight:600, color:C.text }}>
              Waiting for players…
            </div>
            <div style={{ fontSize:13, marginTop:8 }}>
              Share code{" "}
              <span style={{ fontFamily:"monospace", color:C.accentLight, letterSpacing:4 }}>
                {sessionCode}
              </span>{" "}
              with your players
            </div>
          </div>
        ) : (
          <div className="player-grid" style={{ marginBottom:16 }}>
            {playerEntries.map(([pid, player]) => (
              <PlayerCard
                key={pid}
                pid={pid}
                player={player}
                sessionCode={sessionCode}
                sceneActive={sceneActive}
              />
            ))}
          </div>
        )}

        {/* Scene log — only shown once a scene has started */}
        {hasScenes && (
          <SceneLog
            sessionCode={sessionCode}
            scenes={scenes}
            currentSceneId={currentSceneId}
          />
        )}
      </div>
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
