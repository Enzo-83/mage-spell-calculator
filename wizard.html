  // ── Scene Tracker Drawer ──────────────────────────────────────────────────
    function SceneDrawer({ open, onClose, character, onSceneUpdate }) {
      const [mode, setMode]               = useState(null); // null | 'st' | 'player'
      const [roomCode, setRoomCode]       = useState("");
      const [inputCode, setInputCode]     = useState("");
      const [sceneActive, setSceneActive] = useState(false);
      const [sceneNumber, setSceneNumber] = useState(0);
      const [players, setPlayers]         = useState({});
      const [connected, setConnected]     = useState(false);
      const [error, setError]             = useState("");
      const listenerRef     = useRef(null);
      const playerIdRef     = useRef(null); // Cached for consistency within a session
      const lastStEditRef   = useRef(null);  // timestamp of last applied ST stat edit

      // On mount: try to reconnect from localStorage
      useEffect(() => {
        const saved = sceneRecallRoom();
        if (saved && saved.code) {
          if (saved.role === "st") {
            setMode("st");
            setRoomCode(saved.code);
            attachListener(saved.code);
          } else {
            setMode("player");
            setRoomCode(saved.code);
            rejoinAsPlayer(saved.code);
          }
        }
        return () => detachListener();
      }, []);

      function attachListener(code) {
        detachListener();
        const ref = sceneGetRef(code);
        const cb = ref.on("value", snap => {
          const data = snap.val();
          if (!data || data.meta?.closed || data.closed) {
            sessionForget();
            sceneForgetRoom();
            setMode(null);
            setRoomCode("");
            setConnected(false);
            setPlayers({});
            setSceneActive(false);
            setError("Room was closed by the Storyteller");
            if (onSceneUpdate) onSceneUpdate(null);
            return;
          }
          setConnected(true);
          setSceneActive(!!data.sceneActive);
          setSceneNumber(data.sceneNumber || 0);
          setPlayers(data.players || {});
          // Report to App for cross-component access
          if (onSceneUpdate) {
            const pid = getPlayerId();
            const myP = data.players?.[pid];
            // Detect ST stat override: only fire when editedAt is newer than last applied
            const stEdit = myP?.stEdit || null;
            const isNewStEdit = stEdit?.editedAt &&
              stEdit.editedAt !== lastStEditRef.current;
            if (isNewStEdit) lastStEditRef.current = stEdit.editedAt;
            onSceneUpdate({
              code: code,
              playerId: pid,
              connected: true,
              myRolls: myP?.paradoxRolls || 0,
              myStAdj: myP?.stAdjustment || 0,
              myLog: myP?.paradoxLog || [],
              stStatEdit:  isNewStEdit ? stEdit.stats : null,
              stSheetEdit: isNewStEdit ? stEdit.sheet : null,
              myTilts: myP?.tilts || [],
            });
          }
        });
        listenerRef.current = { ref, cb };
      }

      function detachListener() {
        if (listenerRef.current) {
          listenerRef.current.ref.off("value", listenerRef.current.cb);
          listenerRef.current = null;
        }
      }

      function getPlayerId() {
        if (playerIdRef.current) return playerIdRef.current;
        playerIdRef.current = (character?.shadowName || character?.name || "player_" + Math.random().toString(36).slice(2,8))
          .toLowerCase().replace(/[^a-z0-9_]/g, "_");
        return playerIdRef.current;
      }

      function getPlayerName() {
        return character?.shadowName || character?.name || "Unknown Mage";
      }

      function getPlayerPath() {
        return character?.path || "";
      }

      // ── ST: Create Room ──
      function handleCreateRoom() {
        const code = sceneGenerateCode();
        setRoomCode(code);
        setMode("st");
        sceneCreateRoom(code, getPlayerName()).then(() => {
          attachListener(code);
          sceneRememberRoom(code, "st");
        }).catch(e => setError("Failed to create room: " + e.message));
      }

      // ── ST: Start / End Scene ──
      function handleToggleScene() {
        if (sceneActive) {
          sceneSetActive(roomCode, false);
          sceneResetAllPlayers(roomCode);
        } else {
          sceneIncrementNumber(roomCode);
          sceneSetActive(roomCode, true);
          sceneResetAllPlayers(roomCode);
        }
      }

      function handleResetCounters() {
        sceneResetAllPlayers(roomCode);
      }

      // ── ST: Adjust player ──
      function handleAdjust(pid, delta) {
        const p = players[pid];
        if (!p) return;
        const next = (p.stAdjustment || 0) + delta;
        sceneSetPlayerAdjustment(roomCode, pid, next, p.stNote || "");
      }
      function handleNote(pid, note) {
        const p = players[pid];
        if (!p) return;
        sceneSetPlayerAdjustment(roomCode, pid, p.stAdjustment || 0, note);
      }

      // ── Player: Join ──
      function handleJoin() {
        const code = inputCode.trim().toUpperCase();
        if (code.length < 3) { setError("Enter a valid room code"); return; }
        setError("");
        setRoomCode(code);
        playerIdRef.current = null; // Reset so a fresh ID is derived from current character
        rejoinAsPlayer(code);
      }

      function rejoinAsPlayer(code) {
        const pid = getPlayerId();
        sceneGetRef(code).once("value").then(snap => {
          if (!snap.exists()) { setError("Room not found"); setConnected(false); return; }
          setMode("player");
          const playerRef = sceneGetRef(code).child("players/" + pid);
          // Use update() to preserve existing paradoxRolls instead of resetting via set()
          playerRef.update({ name: getPlayerName(), path: getPlayerPath() });
          playerRef.onDisconnect().remove();
          if (character) { scenePushStats(code, pid, character); sessionPushSheet(code, pid, character); }
          attachListener(code);
          sceneRememberRoom(code, "player");
        }).catch(e => setError("Failed to join: " + e.message));
      }

      // ── Disconnect ──
      function handleDisconnect() {
        if (mode === "player") {
          sceneLeaveRoom(roomCode, getPlayerId());
        } else if (mode === "st" && roomCode) {
          sceneGetRef(roomCode).update({ "meta/closed": true, sceneActive: false });
          setTimeout(() => sceneGetRef(roomCode).remove(), 5000);
        }
        detachListener();
        sceneForgetRoom();
        playerIdRef.current = null;
        setMode(null);
        setRoomCode("");
        setInputCode("");
        setConnected(false);
        setPlayers({});
        setSceneActive(false);
        setError("");
        if (onSceneUpdate) onSceneUpdate(null);
      }

      if (!open) return null;

      const pid = getPlayerId();
      const myData = players[pid];
      const effectiveMod = myData ? Math.max(0, (myData.paradoxRolls||0) + (myData.stAdjustment||0)) : 0;
      const playerEntries = Object.entries(players);

      return (
        <div style={{ position:"absolute",inset:0,zIndex:25,background:C.bgDark,
          display:"flex",flexDirection:"column",overflow:"hidden" }}>

          {/* Header */}
          <div style={{ padding:"14px 16px",borderBottom:`1px solid ${C.accentBorder}`,
            display:"flex",alignItems:"center",justifyContent:"space-between",
            background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})` }}>
            <span style={{ fontFamily:"'Rajdhani',sans-serif",fontSize:14,fontWeight:700,
              letterSpacing:2,textTransform:"uppercase",color:C.accentLight }}>
              🎭 Scene Tracker
            </span>
            <button onClick={onClose} style={{ background:"transparent",border:"none",
              color:C.textMuted,fontSize:18,cursor:"pointer",padding:"2px 6px" }}>✕</button>
          </div>

          <div style={{ flex:1,overflowY:"auto",padding:16 }}>

            {error && (
              <div style={{ padding:"8px 12px",borderRadius:8,marginBottom:12,
                background:"rgba(199,62,29,0.15)",border:`1px solid ${C.danger}` }}>
                <span style={{ color:C.danger,fontSize:12 }}>{error}</span>
              </div>
            )}

            {/* ── Mode Chooser ── */}
            {!mode && (
              <div>
                <p style={{ color:C.textMuted,fontSize:13,marginBottom:16,textAlign:"center" }}>
                  Are you the Storyteller or a player?
                </p>
                <div style={{ display:"flex",flexDirection:"column",gap:10 }}>
                  <button onClick={handleCreateRoom} style={{
                    padding:16,borderRadius:10,cursor:"pointer",textAlign:"left",
                    background:C.accentFaint,border:`1px solid ${C.accentBorder}`,
                  }}>
                    <div style={{ color:C.accentLight,fontSize:14,fontWeight:700 }}>Create Room (Storyteller)</div>
                    <div style={{ color:C.textMuted,fontSize:11,marginTop:3 }}>
                      Generate a code and manage scenes for your players
                    </div>
                  </button>
                  <button onClick={()=>setMode("joining")} style={{
                    padding:16,borderRadius:10,cursor:"pointer",textAlign:"left",
                    background:"rgba(42,157,143,0.08)",border:`1px solid rgba(42,157,143,0.3)`,
                  }}>
                    <div style={{ color:C.success,fontSize:14,fontWeight:700 }}>Join Room (Player)</div>
                    <div style={{ color:C.textMuted,fontSize:11,marginTop:3 }}>
                      Enter a room code from your Storyteller
                    </div>
                  </button>
                </div>
              </div>
            )}

            {/* ── Player: Enter Code ── */}
            {mode === "joining" && (
              <div>
                <p style={{ color:C.textMuted,fontSize:13,marginBottom:12 }}>
                  Enter the room code from your Storyteller:
                </p>
                <div style={{ display:"flex",gap:8,marginBottom:12 }}>
                  <input type="text" maxLength={6} value={inputCode}
                    onChange={e=>setInputCode(e.target.value.toUpperCase())}
                    placeholder="CODE"
                    style={{ flex:1,textAlign:"center",fontFamily:"monospace",fontSize:22,
                      letterSpacing:6,padding:"10px 12px",borderRadius:8,
                      background:C.bgDeep,border:`1px solid ${C.accentBorder}`,
                      color:C.text,outline:"none",textTransform:"uppercase" }}/>
                  <button onClick={handleJoin} style={{
                    padding:"10px 20px",borderRadius:8,cursor:"pointer",border:"none",
                    background:C.success,color:"#fff",fontSize:14,fontWeight:700 }}>
                    Join
                  </button>
                </div>
                <button onClick={()=>{setMode(null);setError("");}} style={{
                  background:"transparent",border:"none",color:C.textMuted,
                  fontSize:12,cursor:"pointer",padding:0 }}>
                  ← Back
                </button>
              </div>
            )}

            {/* ── ST View ── */}
            {mode === "st" && (
              <div>
                {/* Room code display */}
                <div style={{ background:C.bgDeep,borderRadius:10,padding:16,textAlign:"center",marginBottom:14 }}>
                  <p style={{ fontSize:9,letterSpacing:2,textTransform:"uppercase",
                    color:C.textMuted,margin:"0 0 4px" }}>Room Code</p>
                  <p style={{ fontSize:32,fontWeight:700,letterSpacing:8,margin:0,
                    fontFamily:"monospace",color:C.accentLight }}>{roomCode}</p>
                  <p style={{ fontSize:11,color:C.textMuted,margin:"6px 0 0" }}>
                    Share this code with your players
                  </p>
                </div>

                {/* Scene status + controls */}
                <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12 }}>
                  <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                    <span style={{ width:8,height:8,borderRadius:"50%",
                      background:sceneActive?C.success:C.textMuted }}/>
                    <span style={{ fontSize:13,fontWeight:600,
                      color:sceneActive?C.success:C.textMuted }}>
                      {sceneActive ? `Scene ${sceneNumber} active` : "No active scene"}
                    </span>
                  </div>
                </div>

                <div style={{ display:"flex",gap:8,marginBottom:16 }}>
                  <button onClick={handleToggleScene} style={{
                    flex:1,padding:11,borderRadius:8,cursor:"pointer",border:"none",
                    fontSize:13,fontWeight:700,
                    background:sceneActive?C.danger:C.success,color:"#fff" }}>
                    {sceneActive ? "End Scene" : "Start Scene"}
                  </button>
                  <button onClick={handleResetCounters} disabled={!sceneActive} style={{
                    flex:1,padding:11,borderRadius:8,cursor:"pointer",
                    border:`1px solid ${C.border}`,background:"transparent",
                    fontSize:13,fontWeight:600,color:C.textMuted,
                    opacity:sceneActive?1:0.4 }}>
                    Reset Counters
                  </button>
                </div>

                {/* Connected players */}
                <SectionHead>Connected Players</SectionHead>
                {playerEntries.length === 0 ? (
                  <div style={{ padding:14,borderRadius:8,background:C.bgDeep,
                    border:`1px solid ${C.border}`,textAlign:"center" }}>
                    <p style={{ color:C.textMuted,fontSize:12 }}>No players connected yet</p>
                  </div>
                ) : (
                  <div style={{ borderRadius:8,border:`1px solid ${C.border}`,overflow:"hidden" }}>
                    {playerEntries.map(([pid, p], i) => {
                      const eff = Math.max(0, (p.paradoxRolls||0) + (p.stAdjustment||0));
                      const isLast = i === playerEntries.length - 1;
                      const s = p.stats || {};
                      const sh = s.health || {};
                      const shFilled = (sh.bashing||0)+(sh.lethal||0)+(sh.aggravated||0);
                      const shMax = sh.max || 7;
                      const shEmpty = Math.max(0, shMax - shFilled);
                      const shWound = shFilled >= shMax ? -3 : shFilled >= shMax-1 ? -2 : shFilled >= shMax-2 ? -1 : 0;
                      const hasStats = s.gnosis !== undefined;
                      return (
                        <div key={pid} style={{ padding:"12px 14px",
                          borderBottom:isLast?"none":`1px solid ${C.borderLight}` }}>
                          <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between" }}>
                            <div>
                              <span style={{ fontSize:13,fontWeight:600,color:C.text }}>{p.name}</span>
                              {p.path && <span style={{ fontSize:11,color:C.textMuted,marginLeft:6 }}>{p.path}</span>}
                            </div>
                            {sceneActive && (
                              <span style={{ fontSize:10,fontWeight:600,padding:"2px 7px",borderRadius:4,
                                background:eff>0?C.dangerFaint:C.successFaint,
                                color:eff>0?C.danger:C.success }}>
                                {eff>0 ? `${eff} paradox (+${eff})` : "0 paradox"}
                              </span>
                            )}
                          </div>

                          {/* Stats grid */}
                          {hasStats && (
                            <div style={{ display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:4,marginTop:8 }}>
                              {[
                                ["Gnosis", s.gnosis, null],
                                ["Wisdom", s.wisdom, s.wisdom<=4?C.warning:null],
                                ["Mana", `${s.mana?.current ?? 0}/${s.mana?.max ?? 10}`, (s.mana?.current??0)<3?C.danger:(s.mana?.current??0)<(s.mana?.max??10)/2?C.warning:null],
                                ["Spells", `${s.activeSpells||0}/${s.maxActiveSpells||1}`, (s.activeSpells||0)>=(s.maxActiveSpells||1)?C.warning:null],
                              ].map(([label,val,clr])=>(
                                <div key={label} style={{ textAlign:"center",padding:"5px 2px",background:C.bgDeep,borderRadius:4 }}>
                                  <div style={{ fontSize:13,fontWeight:700,color:clr||C.text }}>{val}</div>
                                  <div style={{ fontSize:8,color:C.textMuted,letterSpacing:1,textTransform:"uppercase",marginTop:1 }}>{label}</div>
                                </div>
                              ))}
                            </div>
                          )}

                          {/* Health track */}
                          {hasStats && (
                            <div style={{ marginTop:6 }}>
                              <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3 }}>
                                <span style={{ fontSize:9,color:C.textMuted }}>Health</span>
                                <span style={{ fontSize:9,color:shWound<0?C.danger:C.success }}>
                                  {shWound<0?`Wound: ${shWound}`:"No wound penalty"}
                                  {shFilled>=shMax&&(sh.lethal||0)>0?" · Bleeding out!":""}
                                </span>
                              </div>
                              <div style={{ display:"flex",gap:2 }}>
                                {Array.from({length:shMax}).map((_,bi)=>{
                                  let sym="",bg=C.bgDeep,fg=C.textMuted,bd=C.border;
                                  if(bi<(sh.aggravated||0)){sym="*";bg="rgba(199,62,29,0.2)";fg=C.danger;bd=C.danger;}
                                  else if(bi<(sh.aggravated||0)+(sh.lethal||0)){sym="X";bg="rgba(233,196,106,0.15)";fg=C.warning;bd=C.warning;}
                                  else if(bi<shFilled){sym="/";bg=C.bgCard;fg=C.text;bd=C.borderLight;}
                                  return <div key={bi} style={{ flex:1,textAlign:"center",padding:"3px 0",borderRadius:2,
                                    background:bg,border:`1px solid ${bd}`,fontSize:10,fontWeight:700,color:fg,minWidth:0 }}>{sym||"\u00A0"}</div>;
                                })}
                              </div>
                            </div>
                          )}

                          {/* Paradox log chips */}
                          {sceneActive && p.paradoxLog && p.paradoxLog.length > 0 && (
                            <div style={{ marginTop:6 }}>
                              {p.paradoxLog.map((entry, li) => (
                                <div key={li} style={{ display:"inline-block",marginRight:4,marginBottom:3,
                                  padding:"2px 7px",borderRadius:4,fontSize:10,
                                  background:C.dangerFaint,color:C.danger,
                                  border:`1px solid rgba(199,62,29,0.2)` }}>
                                  {entry.spell}{li > 0 ? ` (+${li})` : ""}
                                </div>
                              ))}
                            </div>
                          )}
                          {/* ST Adjustment controls */}
                          {sceneActive && (
                            <div style={{ marginTop:8,padding:"8px 10px",borderRadius:6,
                              background:C.bgDeep }}>
                              <div style={{ display:"flex",alignItems:"center",
                                justifyContent:"space-between",marginBottom:6 }}>
                                <span style={{ fontSize:11,color:C.textMuted }}>ST adjustment</span>
                                <div style={{ display:"flex",alignItems:"center",gap:6 }}>
                                  <button onClick={()=>handleAdjust(pid,-1)} style={{
                                    width:26,height:26,borderRadius:5,cursor:"pointer",fontSize:14,
                                    border:`1px solid ${C.border}`,background:C.bgCard,color:C.text,
                                    display:"flex",alignItems:"center",justifyContent:"center",padding:0
                                  }}>−</button>
                                  <span style={{ minWidth:28,textAlign:"center",fontSize:13,
                                    fontWeight:600,fontFamily:"monospace",
                                    color:(p.stAdjustment||0)!==0?C.warning:C.textMuted }}>
                                    {(p.stAdjustment||0)>=0?"+":""}{p.stAdjustment||0}
                                  </span>
                                  <button onClick={()=>handleAdjust(pid,1)} style={{
                                    width:26,height:26,borderRadius:5,cursor:"pointer",fontSize:14,
                                    border:`1px solid ${C.border}`,background:C.bgCard,color:C.text,
                                    display:"flex",alignItems:"center",justifyContent:"center",padding:0
                                  }}>+</button>
                                </div>
                              </div>
                              <input type="text" placeholder="Reason (visible to player)"
                                value={p.stNote||""} onChange={e=>handleNote(pid,e.target.value)}
                                style={{ width:"100%",padding:"5px 8px",borderRadius:5,fontSize:11,
                                  background:C.bgCard,border:`1px solid ${C.borderLight}`,
                                  color:C.text,outline:"none" }}/>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}

                {/* Disconnect */}
                <button onClick={handleDisconnect} style={{
                  marginTop:16,width:"100%",padding:10,borderRadius:8,cursor:"pointer",
                  background:"transparent",border:`1px solid ${C.danger}`,
                  color:C.danger,fontSize:12,fontWeight:600 }}>
                  Close Room
                </button>
              </div>
            )}

            {/* ── Player View ── */}
            {mode === "player" && (
              <div>
                {/* Scene status banner */}
                <div style={{ display:"flex",alignItems:"center",gap:8,
                  padding:"10px 14px",borderRadius:8,marginBottom:14,
                  background:sceneActive?"rgba(42,157,143,0.1)":C.bgDeep,
                  border:`1px solid ${sceneActive?"rgba(42,157,143,0.3)":C.border}` }}>
                  <span style={{ width:8,height:8,borderRadius:"50%",flexShrink:0,
                    background:sceneActive?C.success:C.textMuted }}/>
                  <span style={{ fontSize:13,fontWeight:600,
                    color:sceneActive?C.success:C.textMuted }}>
                    {sceneActive ? `Scene ${sceneNumber} active` : "No active scene"}
                  </span>
                  <span style={{ marginLeft:"auto",fontSize:11,color:C.textMuted,
                    fontFamily:"monospace" }}>{roomCode}</span>
                </div>

                {/* Paradox tracker */}
                <div style={{ background:C.bgCard,borderRadius:10,padding:16,marginBottom:14,
                  border:`1px solid ${C.border}` }}>
                  <p style={{ fontSize:13,fontWeight:600,color:C.text,margin:"0 0 4px" }}>
                    Paradox rolls this scene
                  </p>
                  <p style={{ fontSize:10,color:C.textMuted,margin:"0 0 14px" }}>
                    Auto-tracked on Send Dice Pool (Phase 2)
                  </p>

                  <div style={{ display:"flex",alignItems:"center",gap:16 }}>
                    <div style={{ background:C.bgDeep,borderRadius:8,padding:"14px 20px",textAlign:"center" }}>
                      <div style={{ fontSize:32,fontWeight:700,color:C.text }}>
                        {myData?.paradoxRolls || 0}
                      </div>
                      <div style={{ fontSize:9,letterSpacing:1.5,textTransform:"uppercase",
                        color:C.textMuted,marginTop:2 }}>Rolls</div>
                    </div>
                    <div style={{ flex:1 }}>
                      <p style={{ fontSize:12,color:C.textMuted,margin:"0 0 4px" }}>Next spell modifier</p>
                      <p style={{ fontSize:20,fontWeight:700,margin:0,
                        color:effectiveMod>0?C.danger:C.text }}>
                        +{effectiveMod} dice
                      </p>
                      <p style={{ fontSize:11,color:C.textMuted,margin:"3px 0 0" }}>
                        {effectiveMod > 0 ? "Added to next Paradox roll" : "No penalty yet"}
                      </p>
                    </div>
                  </div>
                  {/* Paradox log */}
                  {myData?.paradoxLog && myData.paradoxLog.length > 0 && (
                    <div style={{ marginTop:14,borderTop:`1px solid ${C.borderLight}`,paddingTop:10 }}>
                      <p style={{ fontSize:9,letterSpacing:1.5,textTransform:"uppercase",
                        color:C.textMuted,margin:"0 0 6px" }}>Paradox log</p>
                      {myData.paradoxLog.map((entry, i) => (
                        <div key={i} style={{ display:"flex",alignItems:"center",justifyContent:"space-between",
                          padding:"5px 0",borderBottom:i < myData.paradoxLog.length-1 ? `1px solid ${C.borderLight}` : "none" }}>
                          <div style={{ flex:1,minWidth:0 }}>
                            <span style={{ fontSize:12,color:C.text }}>{entry.spell}</span>
                            <span style={{ fontSize:10,color:C.textMuted,marginLeft:6 }}>
                              {entry.paradoxDice === "Chance" ? "Chance die" : entry.paradoxDice + " dice"}
                            </span>
                          </div>
                          {i > 0 && (
                            <span style={{ fontSize:10,color:C.danger,fontWeight:600,flexShrink:0 }}>+{i}</span>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                  {/* ST adjustment notice */}
                  {myData && (myData.stAdjustment||0) !== 0 && (
                    <div style={{ marginTop:12,padding:"8px 12px",borderRadius:6,
                      background:"rgba(233,196,106,0.1)",border:`1px solid rgba(233,196,106,0.3)` }}>
                      <p style={{ margin:0,fontSize:12,fontWeight:600,color:C.warning }}>
                        ST adjustment: {(myData.stAdjustment>=0?"+":"")}{myData.stAdjustment}
                      </p>
                      {myData.stNote && (
                        <p style={{ margin:"3px 0 0",fontSize:11,color:C.warning,opacity:0.8 }}>
                          {myData.stNote}
                        </p>
                      )}
                    </div>
                  )}
                </div>

                {/* Auto-filled field preview */}
                <div style={{ background:C.bgCard,borderRadius:10,padding:16,
                  border:`1px solid ${C.border}` }}>
                  <p style={{ fontSize:12,fontWeight:600,color:C.text,margin:"0 0 3px" }}>
                    In the Paradox section
                  </p>
                  <p style={{ fontSize:10,color:C.textMuted,margin:"0 0 10px" }}>
                    "Previous Paradox Rolls" will auto-fill when connected
                  </p>
                  <div style={{ display:"flex",alignItems:"center",gap:10,
                    background:C.bgDeep,borderRadius:6,padding:"10px 12px" }}>
                    <span style={{ flex:1,fontSize:12,color:C.textMuted }}>
                      Previous Paradox Rolls (this scene)
                    </span>
                    <span style={{ fontSize:14,fontWeight:700,fontFamily:"monospace",
                      background:C.bgCard,border:`1px solid ${C.borderLight}`,
                      borderRadius:5,padding:"3px 10px",color:C.text }}>
                      {effectiveMod}
                    </span>
                    <span style={{ fontSize:9,padding:"2px 6px",borderRadius:4,
                      background:C.accentFaint,color:C.accentLight,fontWeight:600 }}>
                      auto
                    </span>
                  </div>
                </div>

                {/* Disconnect */}
                <button onClick={handleDisconnect} style={{
                  marginTop:16,width:"100%",padding:10,borderRadius:8,cursor:"pointer",
                  background:"transparent",border:`1px solid ${C.danger}`,
                  color:C.danger,fontSize:12,fontWeight:600 }}>
                  Leave Room
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }
  
  // ── Active Spells Drawer ─────────────────────────────────────────────────
    function ActiveSpellsDrawer({ spells, onDismiss, onClose }) {
      const ARCANUM_HEX = {
        death:'#475569', fate:'#e2e8f0', forces:'#f87171', life:'#4ade80',
        matter:'#d97706', mind:'#fbbf24', prime:'#60a5fa', space:'#a78bfa',
        spirit:'#fb923c', time:'#22d3ee',
      };

        improvised:'Improv', improvised_fav:'Improv',
        praxis:'Praxis',
        roteGrimoire:'Rote·Grimoire',
        roteOwn:'Rote·Own',
        roteLearned:'Rote·Learned',
      }[m] || m || 'Improv');
      const badgeColor = m =>
        m?.startsWith('rote') ? C.success :
        m === 'praxis'        ? C.accentLight : C.textMuted;

      return (
        <div style={{ position:"absolute", top:0, left:0, right:0, bottom:0,

          display:"flex", flexDirection:"column",
          borderRadius:20, overflow:"hidden" }}>

          {/* Header */}
          <div style={{ padding:"14px 16px",

            <div>
              <span style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:13, fontWeight:700,

              <span style={{ color:C.textMuted, fontSize:11, marginLeft:8 }}>

              </span>
            </div>

            </button>
          </div>

          {/* Info banner */}
          <div style={{ padding:"8px 16px", flexShrink:0,
            background:"rgba(123,44,191,0.08)",

            fontSize:11, color:C.textMuted, lineHeight:1.5 }}>

          </div>

          {/* Spell list */}
          <div style={{ flex:1, overflowY:"auto", padding:"12px 16px" }}>
            {spells.length === 0 ? (
              <div style={{ textAlign:"center", color:C.textMuted,
                fontSize:13, padding:"48px 0" }}>
                <div style={{ fontSize:32, marginBottom:10 }}>✦</div>
                No active spells.
                <div style={{ fontSize:11, marginTop:6, color:C.textMuted }}>
                  Use "⚡ Set as Active" on the Cast screen.
                </div>
              </div>
            ) : spells.map(spell => {
              const arc      = (spell.arcanum || 'prime').toLowerCase();
              const dotColor = ARCANUM_HEX[arc] || '#a78bfa';
              const dots     = '●'.repeat(Math.min(spell.arcanumLevel || 1, 5));
              const mLabel   = methodLabel(spell.castMethod);
              const bColor   = badgeColor(spell.castMethod);
              return (
                <div key={spell.id} style={{ borderRadius:10,
                  border:`1px solid ${C.border}`,
                  background:"rgba(255,255,255,0.02)",
                  padding:"12px 14px", marginBottom:10 }}>
                  <div style={{ display:"flex", justifyContent:"space-between",
                    alignItems:"flex-start", gap:8 }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:4 }}>
                        <span style={{ fontSize:9, fontWeight:700,
                          padding:"2px 6px", borderRadius:4,
                          color:bColor,
                          border:`1px solid ${bColor}44`,
                          background:`${bColor}18`,
                          textTransform:"uppercase", letterSpacing:.5 }}>
                          {mLabel}
                        </span>
                      </div>
                      <div style={{ fontWeight:700, fontSize:14, color:C.text,
                        whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis" }}>
                        {spell.name}
                      </div>
                      <div style={{ fontSize:11, color:C.textMuted, marginTop:3 }}>
                        <span style={{ color:dotColor }}>
                          {arc.charAt(0).toUpperCase()+arc.slice(1)} {dots}
                        </span>
                        {' · '}Pot {spell.potency}
                        {' · '}{spell.duration}
                        {' · '}{spell.scale}
                      </div>
                      <div style={{ fontSize:10, color:C.textMuted, marginTop:2 }}>
                        {spell.reach} Reach · {spell.mana} Mana
                      </div>
                    </div>
                    <button onClick={() => onDismiss(spell.id)} style={{
                      flexShrink:0, padding:"6px 12px", borderRadius:7,
                      border:"1px solid rgba(199,62,29,0.4)",
                      background:"rgba(199,62,29,0.12)",
                      color:"#f87171", cursor:"pointer",
                      fontSize:12, fontWeight:600 }}>
                      Dismiss
                    </button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }
    function AccordionSection({ id, title, badge, children, openSections, onToggle }) {
      const isOpen = openSections.has(id);
      return (
        <div style={{ border:`1px solid ${C.border}`,borderRadius:8,marginBottom:8,overflow:"hidden" }}>
          <button onClick={() => onToggle(id)} style={{
            width:"100%",padding:"10px 14px",
            display:"flex",alignItems:"center",justifyContent:"space-between",
            background:isOpen?C.accentFaint:"rgba(255,255,255,0.02)",
            border:"none",cursor:"pointer",color:C.text,
          }}>
            <span style={{ fontSize:13,fontWeight:600 }}>{title}</span>
            <div style={{ display:"flex",alignItems:"center",gap:8 }}>
              {badge && <span style={{ fontSize:11,color:C.textMuted }}>{badge}</span>}
              <span style={{ color:C.accentLight,fontSize:12,
                transform:isOpen?"rotate(0deg)":"rotate(-90deg)",transition:"transform 0.2s" }}>▾</span>
            </div>
          </button>
          {isOpen && (
            <div style={{ padding:"0 14px 14px",borderTop:`1px solid ${C.borderLight}` }}>
              {children}
            </div>
          )}
        </div>
      );
    }

    function StepCast({ d, derived, character, onManaChange, onSetActive, onOpenSheet, sceneConn, onSaveToLibrary, poolActionRef }) {
      const { dicePool, usedReach, freeReach, excessReach, totalMana, paradoxDice, chanceOnly,
              potencyPen, durationPen, scalePen, yantraBonus, basePool,
              durEntry, scaleEntry, isRote, methodInfo, yantraCapApplied, yantraCapAdj,
              isCombined, combinedPenalty } = derived;
      const [ds, setDs] = useState({});  // discord button states
      const [manaDeducted, setManaDeducted] = useState(false);
      const [openSections, setOpenSections] = useState(new Set());
      function toggleSection(id) {
        setOpenSections(prev => {
          const next = new Set(prev);
          next.has(id) ? next.delete(id) : next.add(id);
          return next;
        });
      }

      const casterName    = character?.shadowName || character?.name || "Mage";
      const spellTitle    = d.spellName ? `${casterName}'s ${d.spellName}` : `${casterName}'s Spell`;
      const poolWebhook   = character?.discord?.dicePoolWebhook   || "";
      const cardWebhook   = character?.discord?.spellPreviewWebhook || "";
      const methodLabel   = methodInfo?.label || d.method;
      const arcDots       = "●".repeat(d.casterArcanumDots);
      const interval      = RITUAL_INTERVALS[d.gnosis] || "3 hours";
      const rollQualityLabel = derived.poolResult.rollQuality.description;

      // Mana tracking
      const manaC   = character?.mana?.current ?? null;
      const manaM   = character?.mana?.max ?? 10;
      const manaAfter = manaC !== null ? manaC - totalMana : null;
      const manaInsufficient = manaC !== null && totalMana > 0 && manaAfter < 0;
      const manaPerTurn = derived.manaPerTurn;

      function deductMana() {
        if (manaDeducted || !character || totalMana <= 0) return;
        const next = Math.max(0, (character.mana?.current ?? 0) - totalMana);
        if (onManaChange) onManaChange(next);
        setManaDeducted(true);
      }

      // Build dice bot command: $cod N, $rote N, $cod8 N, etc.
      function formatDiceCommand() {
        const rq = derived.poolResult.rollQuality;
        const isRote = rq.quality === 'rote';
        let cmd = "$" + (isRote ? "rote" : "cod");
        if (rq.againValue === 8) cmd += "8";
        else if (rq.againValue === 9) cmd += "9";
        return cmd + " " + dicePool;
      }

      async function handlePool() {
        if (!poolWebhook) { alert("No Dice Pool webhook set in character.discord.dicePoolWebhook"); return; }
        setDs(s=>({...s,pool:"sending"}));
        try {
          // 1. Send embed summary
          const fields = [
            { name:"🎲 Dice Pool", value:String(dicePool),          inline:true },
            { name:"↑ Reach",     value:`${usedReach}/${freeReach}${excessReach>0?" ⚠":""}`, inline:true },
            { name:"⬡ Mana",      value:String(totalMana),          inline:true },
          ];
          if (excessReach>0) fields.push({ name:"⚠️ Paradox", value:chanceOnly?"Chance Die":paradoxDice+" dice", inline:true });
          await postDiscord(poolWebhook, {
            username:casterName,
            embeds:[{ title:spellTitle, color:ARCANUM_COLORS[d.casterArcanum]||0x7b2cbf, fields,
              footer:{ text:`${rollQualityLabel} · ${methodLabel} · ${d.practice||"—"} · ${d.casterArcanum} ${arcDots}` } }],
          });
          // 2. Send dice bot command
          await postDiscord(poolWebhook, { content:formatDiceCommand(), username:casterName });
          deductMana();
          // 3. Auto-increment Paradox counter in Firebase if connected and spell has Paradox risk
          if (sceneConn && excessReach > 0) {
            try {
              sceneGetRef(sceneConn.code).child("players/" + sceneConn.playerId + "/paradoxRolls")
                .transaction(function(n) { return (n || 0) + 1; });
              scenePushParadoxLog(sceneConn.code, sceneConn.playerId, {
                spell: d.spellName || "Unnamed Spell",
                paradoxDice: chanceOnly ? "Chance" : paradoxDice,
                ts: Date.now(),
              });
            } catch (e) { console.warn("Scene Paradox increment failed:", e); }
          }
          setDs(s=>({...s,pool:"ok"}));
          setTimeout(()=>setDs(s=>({...s,pool:null})),3000);
        } catch { setDs(s=>({...s,pool:"error"})); setTimeout(()=>setDs(s=>({...s,pool:null})),4000); }
      }

      useEffect(() => {
        if (poolActionRef) poolActionRef.current = handlePool;
      });

      async function handleCard() {
        if (!cardWebhook) { alert("No Spell Card webhook set in character.discord.spellPreviewWebhook"); return; }
        setDs(s=>({...s,card:"sending"}));
        try {
          const fields = [
            { name:"🎲 Dice Pool", value:String(dicePool),          inline:true },
            { name:"↑ Reach",     value:`${usedReach}/${freeReach}${excessReach>0?" ⚠":""}`, inline:true },
            { name:"⬡ Mana",      value:String(totalMana),          inline:true },
            { name:"Potency",     value:String(d.potency) + (d.advancedPotency ? " (Adv)" : ""),           inline:true },
            { name:"Duration",    value:durEntry?.label||"—",        inline:true },
            { name:"Scale",       value:scaleEntry?.label||"—",      inline:true },
            { name:"Range",       value:RANGES.find(r=>r.id===d.range)?.label||d.range, inline:true },
            { name:"Cast Time",   value:(d.castTime==="instant" && !methodInfo?.doubleRitual)?"Instant"
                :`Ritual${d.ritualIntervals>0?` +${d.ritualIntervals} × ${methodInfo?.doubleRitual?"2×":""}${interval}`:""}${methodInfo?.doubleRitual?" (2×)":""}`, inline:true },
          ];
          if (excessReach>0) fields.push({ name:"⚠️ Paradox", value:chanceOnly?"Chance Die":paradoxDice+" dice", inline:true });
          await postDiscord(cardWebhook, {
            username:casterName,
            embeds:[{ title:spellTitle, color:ARCANUM_COLORS[d.casterArcanum]||0x7b2cbf, fields,
              footer:{ text:`${methodLabel} · ${rollQualityLabel} · ${d.practice||"—"} · ${d.casterArcanum} ${arcDots}` } }],
          });
          setDs(s=>({...s,card:"ok"}));
          setTimeout(()=>setDs(s=>({...s,card:null})),3000);
        } catch { setDs(s=>({...s,card:"error"})); setTimeout(()=>setDs(s=>({...s,card:null})),4000); }
      }

      function StatBox({ label, value, color, sub }) {
        return (
          <div style={{ flex:1,background:C.bgDeep,borderRadius:8,padding:"12px 8px",textAlign:"center" }}>
            <div style={{ fontSize:28,fontWeight:700,color:color||C.accentLight,lineHeight:1 }}>{value}</div>
            {sub&&<div style={{ fontSize:10,color:C.textMuted,marginTop:1 }}>{sub}</div>}
            <div style={{ color:C.textMuted,fontSize:9,letterSpacing:2,textTransform:"uppercase",marginTop:3 }}>{label}</div>
          </div>
        );
      }

      function DBtn({ label, status, onClick, noHook }) {
        const bg    = status==="ok"?C.success:status==="error"?C.danger:status==="sending"?"#666":C.discord;
        const txt   = status==="ok"?"✓ Sent!":status==="error"?"✗ Failed":status==="sending"?"Sending…":label;
        return (
          <button onClick={onClick} disabled={!!status||noHook} style={{
            padding:13,borderRadius:8,border:"none",cursor:status||noHook?"default":"pointer",
            background:noHook?"#1e1e3a":bg,color:"#fff",fontSize:12,fontWeight:700,
            opacity:noHook?0.4:1,transition:"background .3s",
          }}>
            {noHook?`${label} (no webhook)`:txt}
          </button>
        );
      }

      const castTimeStr = (d.castTime==="instant" && !methodInfo?.doubleRitual) ? "Instant"
        : `Ritual${d.ritualIntervals>0?` +${d.ritualIntervals}`:""}`
        + (methodInfo?.doubleRitual?" (2×)":"");
      const hasParadoxRisk = excessReach > 0;

      return (
        <div>
          {/* ── Zone 1: Action ── */}
          <div style={{ textAlign:"center",padding:"20px 16px 16px",
            background:C.bgDeep,borderRadius:10,marginBottom:12 }}>
            <div style={{ fontSize:56,fontWeight:700,color:C.accentLight,lineHeight:1 }}>
              {dicePool}
            </div>
            <div style={{ color:C.textMuted,fontSize:14,marginTop:4 }}>
              dice pool
              {methodInfo?.roteQuality && (
                <span style={{ marginLeft:8,background:C.successFaint,
                  color:C.success,padding:"2px 8px",borderRadius:10,fontSize:11,fontWeight:700 }}>
                  Rote Quality
                </span>
              )}
            </div>
            <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr 1fr",
              gap:8,marginTop:16,paddingTop:16,borderTop:`1px solid ${C.borderLight}` }}>
              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:20,fontWeight:700,
                  color:excessReach>0?C.danger:C.text }}>
                  {usedReach}/{freeReach}
                </div>
                <div style={{ fontSize:10,color:C.textMuted,textTransform:"uppercase",
                  letterSpacing:1 }}>Reach</div>
              </div>
              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:20,fontWeight:700,color:C.warning }}>{totalMana}</div>
                <div style={{ fontSize:10,color:C.textMuted,textTransform:"uppercase",
                  letterSpacing:1 }}>Mana</div>
              </div>
              <div style={{ textAlign:"center" }}>
                <div style={{ fontSize:14,fontWeight:700,color:C.text }}>{castTimeStr}</div>
                <div style={{ fontSize:10,color:C.textMuted,textTransform:"uppercase",
                  letterSpacing:1 }}>Cast Time</div>
              </div>
            </div>
          </div>

          {/* Paradox alert */}
          {hasParadoxRisk && (
            <div style={{ padding:"10px 14px",borderRadius:8,marginBottom:12,
              background:C.dangerFaint,border:`1px solid ${C.danger}` }}>
              <div style={{ display:"flex",alignItems:"center",gap:8,flexWrap:"wrap" }}>
                <span style={{ color:C.danger,fontSize:13,fontWeight:700 }}>⚠ Paradox Risk</span>
                <span style={{ background:C.danger,color:"#fff",padding:"2px 8px",
                  borderRadius:6,fontSize:12,fontWeight:700 }}>
                  {chanceOnly ? "1 chance die" : `${paradoxDice} dice`}
                </span>
              </div>
              <div style={{ display:"flex",gap:12,marginTop:8,fontSize:11,color:C.textMuted }}>
                <span style={{ color:C.warning }}>Contain: absorb into soul</span>
                <span>Release: manifest externally</span>
              </div>
            </div>
          )}

          {/* Mana validation */}
          {manaInsufficient && !manaDeducted && (
            <div style={{ padding:"10px 14px",borderRadius:8,background:C.dangerFaint,border:`1px solid ${C.danger}`,marginBottom:8 }}>
              <span style={{ color:C.danger,fontSize:12,fontWeight:700 }}>✗ Insufficient mana — need {totalMana}, have {manaC}</span>
            </div>
          )}

          {/* Primary CTA */}
          <DBtn label="Send Dice Pool to Discord" status={ds.pool} onClick={handlePool} noHook={!poolWebhook}/>
          <div style={{ height:8 }}/>

          {/* Secondary actions row */}
          <div style={{ display:"flex",gap:8,marginBottom:16,flexWrap:"wrap" }}>
            <button onClick={handleCard} disabled={!!ds.card||!cardWebhook}
              style={{ flex:1,minWidth:80,padding:"9px",
                borderRadius:6,cursor:ds.card||!cardWebhook?"default":"pointer",
                fontSize:12,fontWeight:600,
                background:"rgba(88,101,242,0.15)",border:`1px solid ${C.discord}`,color:C.discord,
                opacity:!cardWebhook?0.4:1 }}>
              {ds.card==="ok"?"✓ Sent":ds.card==="sending"?"…":"Spell Card"}
            </button>
            <button onClick={deductMana} disabled={!character||totalMana<=0||manaDeducted}
              style={{ flex:1,minWidth:80,padding:"9px",
                borderRadius:6,cursor:character&&totalMana>0&&!manaDeducted?"pointer":"not-allowed",
                fontSize:12,fontWeight:600,
                opacity:character&&totalMana>0&&!manaDeducted?1:0.4,
                background:manaDeducted?C.successFaint:C.warningFaint,
                border:`1px solid ${manaDeducted?C.success:C.warning}`,
                color:manaDeducted?C.success:C.warning }}>
              {manaDeducted?"✓ Deducted":`−${totalMana} Mana`}
            </button>
            <button onClick={() => {
              if (!character || !onSetActive) return;
              const durOpts   = d.advancedDuration ? DURATION_ADVANCED : DURATION_STANDARD;
              const scaleOpts = d.advancedScale
                ? (d.scaleMode === 'area' ? SCALE_ADV_AREA : SCALE_ADV_SUBJECTS)
                : (d.scaleMode === 'area' ? SCALE_STD_AREA : SCALE_STD_SUBJECTS);
              onSetActive({
                name:         d.spellName || 'Unnamed Spell',
                arcanum:      (d.casterArcanum || 'prime').toLowerCase(),
                arcanumLevel: d.casterArcanumDots,
                castMethod:   d.method,
                potency:      d.potency,
                duration:     durOpts[d.durationIndex]?.label   || '—',
                scale:        scaleOpts[d.scaleIndex]?.label    || '—',
                reach:        usedReach,
                mana:         totalMana,
              });
              if (onOpenSheet) onOpenSheet();
            }} disabled={!character}
              style={{ flex:1,minWidth:80,padding:"9px",
                borderRadius:6,cursor:character?"pointer":"not-allowed",
                fontSize:12,fontWeight:600,opacity:character?1:0.4,
                background:C.accentFaint,border:`1px solid ${C.accentBorder}`,color:C.accentLight }}>
              ⚡ Active
            </button>
            <button onClick={() => { if (onSaveToLibrary) onSaveToLibrary(); }}
              disabled={!character}
              style={{ flex:1,minWidth:80,padding:"9px",
                borderRadius:6,cursor:character?"pointer":"not-allowed",
                fontSize:12,fontWeight:600,opacity:character?1:0.4,
                background:C.successFaint,border:`1px solid ${C.success}`,color:C.success }}>
              Save
            </button>
          </div>

          {/* ── Zone 2: Reference (collapsed) ── */}
          <AccordionSection id="breakdown" title="Dice Breakdown"
            badge={`${dicePool} total`}
            openSections={openSections} onToggle={toggleSection}>
            {[
              [isRote
                ? `Skill (${d.roteSkill}) + Arcanum ${d.casterArcanumDots}`
                : isCombined
                ? `Gnosis ${d.gnosis} + Lowest Arcanum`
                : `Gnosis ${d.gnosis} + Arcanum ${d.casterArcanumDots}`,
               `+${basePool}`],
              combinedPenalty!==0 && [`Combined (${d.combinedSpells.length} spells)`, `${combinedPenalty}`],
              potencyPen!==0  && [`Potency ${d.potency} penalty`,          `${potencyPen}`],
              durationPen!==0 && [`Duration ${durEntry?.label} penalty`,   `${durationPen}`],
              scalePen!==0    && [`Scale ${scaleEntry?.label} penalty`,    `${scalePen}`],
              yantraBonus!==0 && ["Yantras / Intervals",                   `+${yantraBonus}`],
              d.spendWP       && ["Willpower",                             "+3"],
              d.teamworkDice>0&& ["Teamwork",                              `+${d.teamworkDice}`],
              d.otherMod!==0  && ["Other modifier",                        `${d.otherMod>0?"+":""}${d.otherMod}`],
              yantraCapApplied && ["Yantra cap (net max +5)",               `${yantraCapAdj}`],
            ].filter(Boolean).map(([k,v])=>(
              <div key={k} style={{ display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid ${C.borderLight}` }}>
                <span style={{ color:C.textMuted,fontSize:12 }}>{k}</span>
                <span style={{ color:String(v).startsWith("-")?C.danger:String(v).startsWith("+")?C.success:C.text,fontSize:12,fontWeight:600 }}>{v}</span>
              </div>
            ))}
            <div style={{ display:"flex",justifyContent:"space-between",padding:"6px 0" }}>
              <span style={{ color:C.text,fontSize:13,fontWeight:700 }}>Total</span>
              <span style={{ color:C.accentLight,fontSize:15,fontWeight:700 }}>{dicePool}</span>
            </div>
          </AccordionSection>

          <AccordionSection id="factors" title="Spell Factors"
            badge={`${derived.totalFactorPen} penalty`}
            openSections={openSections} onToggle={toggleSection}>
            {[
              ["Potency",     d.potency + (d.advancedPotency ? " (Advanced)" : "")],
              ["Duration",    durEntry?.label||"—"],
              ["Scale",       scaleEntry?.label||"—"],
              ["Range",       RANGES.find(r=>r.id===d.range)?.label||d.range],
              ["Cast Time",   castTimeStr],
              ["Roll Quality",rollQualityLabel],
            ].map(([k,v])=>(
              <div key={k} style={{ display:"flex",justifyContent:"space-between",padding:"4px 0",borderBottom:`1px solid ${C.borderLight}` }}>
                <span style={{ color:C.textMuted,fontSize:12 }}>{k}</span>
                <span style={{ color:C.text,fontSize:12 }}>{v}</span>
              </div>
            ))}
          </AccordionSection>

          {totalMana > 0 && (
            <AccordionSection id="mana" title="Mana Ledger"
              badge={`${totalMana} required`}
              openSections={openSections} onToggle={toggleSection}>
              {[
                ["Non-Ruling Improvised",  derived.nonRulingMana],
                ["Indefinite Duration",    derived.indefiniteMana],
                ["Sympathetic / Temporal", derived.sympathyMana],
                ["Paradox Mitigation",     d.mitigateMana],
                ["Additional Costs",       d.extraManaCost],
              ].filter(([,v])=>v>0).map(([k,v])=>(
                <div key={k} style={{ display:"flex",justifyContent:"space-between",padding:"3px 0",borderBottom:`1px solid ${C.borderLight}` }}>
                  <span style={{ color:C.textMuted,fontSize:11 }}>{k}</span>
                  <span style={{ color:C.text,fontSize:11,fontWeight:600 }}>{v}</span>
                </div>
              ))}
              <div style={{ display:"flex",justifyContent:"space-between",padding:"6px 0",marginTop:2 }}>
                <span style={{ color:C.text,fontSize:12,fontWeight:700 }}>Total cost</span>
                <span style={{ color:C.warning,fontSize:12,fontWeight:700 }}>{totalMana}</span>
              </div>
              {manaC !== null && (
                <div style={{ background:"rgba(255,255,255,0.04)",borderRadius:6,padding:"8px 10px",marginTop:6 }}>
                  <div style={{ display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2 }}>
                    <span style={{ color:C.textMuted }}>Current mana</span><span>{manaC}</span>
                  </div>
                  <div style={{ display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:2 }}>
                    <span style={{ color:C.textMuted }}>Cost</span><span style={{ color:C.warning }}>−{totalMana}</span>
                  </div>
                  <div style={{ height:1,background:C.borderLight,margin:"3px 0" }}/>
                  <div style={{ display:"flex",justifyContent:"space-between",fontSize:12,fontWeight:700 }}>
                    <span>After cast</span>
                    <span style={{ color:manaAfter>0?C.success:manaAfter===0?C.warning:C.danger }}>{Math.max(0,manaAfter)}</span>
                  </div>
                </div>
              )}
              <div style={{ marginTop:6,fontSize:10,color:C.textMuted }}>Per-turn limit: {manaPerTurn} mana (Gnosis {d.gnosis})</div>
            </AccordionSection>
          )}

          {hasParadoxRisk && (
            <AccordionSection id="paradox" title="Paradox Detail"
              badge={chanceOnly ? "chance die" : `${paradoxDice} dice`}
              openSections={openSections} onToggle={toggleSection}>
              {chanceOnly ? (
                <div style={{ padding:"6px 0" }}>
                  <p style={{ margin:0,color:C.warning,fontSize:12,fontWeight:700 }}>⚀ Paradox Chance Die</p>
                  <p style={{ margin:"3px 0 0",color:C.textMuted,fontSize:11 }}>
                    Fully mitigated — but excess Reach always incurs at least a Chance Die.
                  </p>
                </div>
              ) : (
                <div style={{ padding:"6px 0",color:C.textMuted,fontSize:12 }}>
                  {excessReach} excess Reach × {PARADOX_PER_REACH[d.gnosis]||1} per Reach = {paradoxDice} paradox dice
                </div>
              )}
            </AccordionSection>
          )}

          {(!poolWebhook||!cardWebhook)&&(
            <Hint>
              Configure webhooks in your character JSON under <code style={{ color:C.accentLight }}>discord.dicePoolWebhook</code> / <code style={{ color:C.accentLight }}>discord.spellPreviewWebhook</code>.
            </Hint>
          )}

        </div>
      );
    }

    // ── Cast footer (outside scroll area, always visible on Cast step) ─────
    function CastFooter({ derived, character, poolActionRef }) {
      const { dicePool } = derived;
      const [sendState, setSendState] = useState(null);
      const poolWebhook = character?.discord?.dicePoolWebhook || "";
      async function handleSend() {
        if (!poolActionRef?.current) return;
        setSendState("sending");
        try {
          await poolActionRef.current();
          setSendState("ok");
          setTimeout(() => setSendState(null), 3000);
        } catch { setSendState(null); }
      }
      return (
        <div style={{ position:"fixed",bottom:0,left:0,right:0,zIndex:50,
          maxWidth:440,margin:"0 auto",
          background:C.bgCard,borderTop:`1px solid ${C.border}`,
          padding:"10px 16px",display:"flex",alignItems:"center",gap:12,
          boxShadow:"0 -4px 20px rgba(0,0,0,0.5)" }}>
          <div style={{ textAlign:"center",minWidth:56 }}>
            <div style={{ fontSize:28,fontWeight:700,color:C.accentLight,lineHeight:1 }}>{dicePool}</div>
            <div style={{ fontSize:8,letterSpacing:1.5,textTransform:"uppercase",color:C.textMuted,marginTop:2 }}>dice</div>
          </div>
          <button onClick={handleSend} disabled={!!sendState||!poolWebhook}
            style={{ flex:1,padding:"12px 0",borderRadius:8,cursor:sendState||!poolWebhook?"default":"pointer",
              fontSize:13,fontWeight:700,border:"none",
              background:!poolWebhook?"rgba(88,101,242,0.15)":`linear-gradient(135deg,${C.discord},#4752c4)`,
              color:"#fff",opacity:!poolWebhook?0.4:1,
              boxShadow:poolWebhook?`0 4px 12px rgba(88,101,242,0.3)`:"none" }}>
            {sendState==="ok"?"✓ Sent":sendState==="sending"?"Sending…":"Send Dice Pool to Discord"}
          </button>
        </div>
      );
    }

    // ── Mini-bar ──────────────────────────────────────────────────────────────
    function MiniBar({ derived, character }) {
      const { dicePool, usedReach, freeReach, excessReach, totalMana, paradoxDice, chanceOnly } = derived;
      const manaC = character?.mana?.current ?? null;
      const manaLabel = manaC !== null && totalMana > 0 ? `${totalMana}/${manaC}` : String(totalMana);
      const manaColor = manaC !== null && totalMana > manaC ? C.danger : totalMana > 0 ? C.warning : C.text;
      function S({ label, value, color }) {
        return (
          <div style={{ textAlign:"center",flex:1 }}>
            <div style={{ fontSize:18,fontWeight:700,color:color||C.accentLight,lineHeight:1 }}>{value}</div>
            <div style={{ fontSize:8,letterSpacing:1.5,textTransform:"uppercase",color:C.textMuted,marginTop:1 }}>{label}</div>
          </div>
        );
      }
      return (
        <div style={{ background:C.bgCard,borderTop:`2px solid ${C.accentBorder}`,padding:"10px 16px 8px" }}>
                    <div style={{ display:"flex",alignItems:"center",gap:6 }}>
            <S label="Dice" value={dicePool}/>
            <div style={{ width:1,height:24,background:C.border }}/>
            <S label="Reach" value={`${usedReach}/${freeReach}`} color={excessReach>0?C.warning:C.success}/>
            <div style={{ width:1,height:24,background:C.border }}/>
            <S label={manaC!==null?"Cost/Pool":"Mana"} value={manaLabel} color={manaColor}/>
            <div style={{ width:1,height:24,background:C.border }}/>
            <S label="Paradox" value={chanceOnly?"⚀":paradoxDice} color={chanceOnly?C.warning:paradoxDice>0?C.danger:C.success}/>

      );

    // ── Character helpers ─────────────────────────────────────────────────────
    function applyCharacterToForm(char, setD) {
      let highestKey = "prime", highestDots = 0;
      for (const [key, dots] of Object.entries(char.arcana || {})) {
        if (dots > highestDots) { highestDots = dots; highestKey = key; }
      }
      let skillKey = "occult", skillDots = 0;
      for (const [key, dots] of Object.entries(char.skills || {})) {
        if (dots > skillDots) { skillDots = dots; skillKey = key; }
      }
      setD(prev => ({
        ...prev,
        gnosis:            char.gnosis         ?? prev.gnosis,
        casterArcanum:     highestKey.charAt(0).toUpperCase() + highestKey.slice(1),
        casterArcanumDots: highestDots         || prev.casterArcanumDots,
        spellArcanumReq:   highestDots         || prev.spellArcanumReq,
        activeSpells:      (char.activeSpells  || []).length,
        roteSkill:         SKILL_KEY_TO_LABEL[skillKey] || "Occult",
        roteSkillDots:     skillDots,
      }));
    }

    // ── Character header ──────────────────────────────────────────────────────
    function CharacterHeader({ character, onLoad, onSave, onNew, onManaChange, onHealthChange, onWillpowerChange, activeCount, onSheetToggle, onSceneToggle, sceneConnected, onCompendiumToggle, compUser, justSaved }) {
      const fileRef = useRef(null);
      const [manaOpen, setManaOpen] = useState(false);
      const [healthOpen, setHealthOpen] = useState(false);
      const [wpOpen, setWpOpen] = useState(false);
      const manaC   = character?.mana?.current ?? 0;
      const manaM   = character?.mana?.max     ?? 10;
      const manaPerTurn = MANA_PER_TURN[character?.gnosis] || 1;
      const wpC = character?.willpower?.current ?? 0;
      const wpM = character?.willpower?.max     ?? 5;
      const hp = character?.health || { max: 7, bashing: 0, lethal: 0, aggravated: 0 };
      const hpFilled = hp.bashing + hp.lethal + hp.aggravated;
      const hpEmpty = Math.max(0, hp.max - hpFilled);
      const woundPen = hpFilled >= hp.max ? -3 : hpFilled >= hp.max - 1 ? -2 : hpFilled >= hp.max - 2 ? -1 : 0;

      function handleFileChange(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try { onLoad(JSON.parse(ev.target.result)); }
          catch { alert("Invalid character file — could not parse JSON."); }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

      function adjustMana(delta) {
        const next = Math.max(0, Math.min(manaM, manaC + delta));
        if (next !== manaC && onManaChange) onManaChange(next);
      }

      return (
        <div style={{ background:C.bgCard,borderBottom:`1px solid ${C.border}` }}>
          <div style={{ padding:"10px 16px",
            display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8 }}>
            <input type="file" accept=".json" ref={fileRef} onChange={handleFileChange} style={{ display:"none" }}/>
            <div>
              {character ? (
                <>
                  <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                    <span style={{ color:C.accentLight,fontSize:14,fontWeight:700 }}>
                      {character.shadowName || character.name}
                    </span>
                    {character.shadowName&&<span style={{ color:C.textMuted,fontSize:11 }}>({character.name})</span>}
                    {justSaved && (
                      <span style={{ fontSize:10,color:C.success,letterSpacing:0.5,
                        padding:"1px 6px",borderRadius:4,background:C.successFaint }}>
                        Saved
                      </span>
                    )}
                  </div>
                  <div style={{ color:C.textMuted,fontSize:11 }}>
                    {character.path} · {character.order} · Gnosis {character.gnosis}
                    <span onClick={()=>setManaOpen(o=>!o)}
                      style={{ color:manaC<3?C.danger:C.warning,marginLeft:8,cursor:"pointer",
                        borderBottom:manaOpen?`1px solid ${C.accentLight}`:"1px solid transparent" }}>
                      ⬡ {manaC}/{manaM} Mana
                    </span>
                    <span onClick={()=>setHealthOpen(o=>!o)}
                      style={{ color:hpFilled>0?(woundPen<=-2?C.danger:C.warning):C.success,marginLeft:8,cursor:"pointer",
                        borderBottom:healthOpen?`1px solid ${C.accentLight}`:"1px solid transparent" }}>
                      ♥ {hpEmpty}/{hp.max} HP{woundPen<0?` (${woundPen})`:""}
                    </span>
                    <span onClick={()=>setWpOpen(o=>!o)}
                      style={{ color:wpC<=1?C.danger:wpC<=2?C.warning:"#6ec6f5",marginLeft:8,cursor:"pointer",
                        borderBottom:wpOpen?`1px solid ${C.accentLight}`:"1px solid transparent" }}>
                      ◈ {wpC}/{wpM} WP
                    </span>
                  </div>
                </>
              ) : (
                <span style={{ color:C.textMuted,fontSize:13 }}>No character loaded — tap Load</span>
              )}
            </div>
            <div style={{ display:"flex",gap:6 }}>
              <button onClick={onNew} style={{ padding:"4px 10px",borderRadius:5,fontSize:11,fontWeight:600,
                cursor:"pointer",background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted }}>New</button>
              <button onClick={()=>fileRef.current?.click()} style={{ padding:"4px 10px",borderRadius:5,fontSize:11,fontWeight:600,
                cursor:"pointer",background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted }}>Load</button>
              <button onClick={character?onSave:undefined} style={{ padding:"4px 10px",borderRadius:5,fontSize:11,fontWeight:600,
                cursor:character?"pointer":"not-allowed",
                background:character?C.accentFaint:"transparent",
                border:`1px solid ${character?C.accentBorder:C.border}`,
                color:character?C.accentLight:C.textMuted,opacity:character?1:0.4 }}>Save</button>
              <button onClick={onSceneToggle}
                style={{ display:"flex", alignItems:"center", gap:5,
                  padding:"5px 10px", borderRadius:6, fontSize:12,
                  cursor:"pointer",
                  background:sceneConnected ? "rgba(42,157,143,0.12)" : "rgba(255,255,255,0.05)",
                  border:`1px solid ${sceneConnected ? C.success : C.border}`,
                  color:sceneConnected ? C.success : C.text }}>
                <span>🎭</span>
                <span>Scene</span>
                {sceneConnected && (
                  <span style={{ width:6, height:6, borderRadius:"50%",
                    background:C.success, display:"inline-block" }}/>
                )}
              </button>
              <button onClick={character ? onSheetToggle : undefined}
                style={{ display:"flex", alignItems:"center", gap:5,
                  padding:"5px 10px", borderRadius:6, fontSize:12,
                  cursor: character ? "pointer" : "not-allowed",
                  background: activeCount > 0 ? "rgba(123,44,191,0.2)" : "rgba(255,255,255,0.05)",
                  border:`1px solid ${activeCount > 0 ? C.accentBorder : C.border}`,
                  color: C.text, opacity: character ? 1 : 0.4 }}>
                <span>⚡</span>
                <span style={{ fontWeight:700, color:C.accentLight }}>{activeCount}</span>
                <span style={{ color:C.textMuted }}>Active</span>
              </button>
              <button onClick={onCompendiumToggle}
                style={{ position:"relative", padding:"4px 10px", borderRadius:5, fontSize:11, fontWeight:600,
                  cursor:"pointer",
                  background: compUser ? "rgba(233,196,106,0.15)" : "transparent",
                  border:`1px solid ${compUser ? "rgba(233,196,106,0.4)" : C.border}`,
                  color: compUser ? C.warning : C.textMuted }}>
                📖
                {compUser && (
                  <span style={{ position:"absolute", top:-3, right:-3,
                    width:7, height:7, borderRadius:"50%",
                    background:C.success, border:`2px solid ${C.bgCard}` }}/>
