              </button>
            </div>
          </div>
          {character && manaOpen && (
            <div style={{ padding:"6px 16px 10px",borderTop:`1px solid ${C.borderLight}`,
              display:"flex",alignItems:"center",justifyContent:"space-between" }}>
              <span style={{ color:C.textMuted,fontSize:11 }}>Adjust mana</span>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <button onClick={()=>adjustMana(-1)} style={{ width:28,height:28,borderRadius:6,fontSize:16,
                  cursor:"pointer",background:"transparent",border:`1px solid ${C.border}`,color:C.text,
                  display:"flex",alignItems:"center",justifyContent:"center",padding:0 }}>−</button>
                <span style={{ fontSize:16,fontWeight:700,color:C.warning,minWidth:24,textAlign:"center" }}>{manaC}</span>
                <button onClick={()=>adjustMana(1)} style={{ width:28,height:28,borderRadius:6,fontSize:16,
                  cursor:"pointer",background:"transparent",border:`1px solid ${C.border}`,color:C.text,
                  display:"flex",alignItems:"center",justifyContent:"center",padding:0 }}>+</button>
                <span style={{ color:C.textMuted,fontSize:10,marginLeft:4 }}>/ {manaM} · per turn: {manaPerTurn}</span>
              </div>
            </div>
          )}
          {character && wpOpen && (
            <div style={{ padding:"6px 16px 10px",borderTop:`1px solid ${C.borderLight}`,
              display:"flex",alignItems:"center",justifyContent:"space-between" }}>
              <span style={{ color:C.textMuted,fontSize:11 }}>Adjust willpower</span>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <button onClick={()=>{ const n=Math.max(0,wpC-1); if(n!==wpC&&onWillpowerChange) onWillpowerChange(n); }}
                  style={{ width:28,height:28,borderRadius:6,fontSize:16,cursor:"pointer",
                    background:"transparent",border:`1px solid ${C.border}`,color:C.text,
                    display:"flex",alignItems:"center",justifyContent:"center",padding:0 }}>−</button>
                <span style={{ fontSize:16,fontWeight:700,color:"#6ec6f5",minWidth:24,textAlign:"center" }}>{wpC}</span>
                <button onClick={()=>{ const n=Math.min(wpM,wpC+1); if(n!==wpC&&onWillpowerChange) onWillpowerChange(n); }}
                  style={{ width:28,height:28,borderRadius:6,fontSize:16,cursor:"pointer",
                    background:"transparent",border:`1px solid ${C.border}`,color:C.text,
                    display:"flex",alignItems:"center",justifyContent:"center",padding:0 }}>+</button>
                <span style={{ color:C.textMuted,fontSize:10,marginLeft:4 }}>/ {wpM}</span>
              </div>
            </div>
          )}
          {character && healthOpen && (
            <div style={{ padding:"6px 16px 10px",borderTop:`1px solid ${C.borderLight}` }}>
              <div style={{ display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8 }}>
                <span style={{ color:C.textMuted,fontSize:11 }}>Health track</span>
                <span style={{ color:C.textMuted,fontSize:10 }}>
                  {hp.aggravated>0?`${hp.aggravated}*  `:""}{hp.lethal>0?`${hp.lethal}X  `:""}{hp.bashing>0?`${hp.bashing}/  `:""}{hpEmpty>0?`${hpEmpty} empty`:"FULL"}
                  {woundPen<0?`  ·  Wound: ${woundPen}`:""}
                </span>
              </div>
              <div style={{ display:"flex",gap:2,marginBottom:8 }}>
                {Array.from({length:hp.max}).map((_,i) => {
                  let sym="", bg=C.bgDeep, fg=C.textMuted, bd=C.border;
                  if (i<hp.aggravated) { sym="*"; bg="rgba(199,62,29,0.2)"; fg=C.danger; bd=C.danger; }
                  else if (i<hp.aggravated+hp.lethal) { sym="X"; bg="rgba(233,196,106,0.15)"; fg=C.warning; bd=C.warning; }
                  else if (i<hpFilled) { sym="/"; bg=C.bgCard; fg=C.text; bd=C.borderLight; }
                  return (
                    <div key={i} style={{ flex:1,textAlign:"center",padding:"4px 0",borderRadius:3,
                      background:bg,border:`1px solid ${bd}`,fontSize:12,fontWeight:700,color:fg,minWidth:0 }}>
                      {sym||"\u00A0"}
                    </div>
                  );
                })}
              </div>
              <div style={{ display:"flex",gap:6,flexWrap:"wrap" }}>
                <span style={{ color:C.textMuted,fontSize:10,lineHeight:"26px" }}>Deal:</span>
                {[["Bashing","/","bashing"],["Lethal","X","lethal"],["Agg","*","aggravated"]].map(([label,sym,key])=>(
                  <button key={key} onClick={()=>{
                    const h={...hp};
                    if(hpFilled>=h.max){
                      if(key==="bashing"||key==="lethal"){if(h.bashing>0){h.bashing--;h.lethal++;}else if(h.lethal>0){h.lethal--;h.aggravated++;}}
                      else{if(h.lethal>0){h.lethal--;h.aggravated++;}else if(h.bashing>0){h.bashing--;h.aggravated++;}}
                    } else { h[key]++; }
                    onHealthChange(h);
                  }} style={{ padding:"3px 10px",borderRadius:5,fontSize:10,fontWeight:700,cursor:"pointer",
                    background:"transparent",border:`1px solid ${key==="aggravated"?C.danger:key==="lethal"?C.warning:C.borderLight}`,
                    color:key==="aggravated"?C.danger:key==="lethal"?C.warning:C.text }}>
                    +{sym} {label}
                  </button>
                ))}
                <button onClick={()=>{
                  const h={...hp};
                  if(h.bashing>0) h.bashing--;
                  else if(h.lethal>0) h.lethal--;
                  else if(h.aggravated>0) h.aggravated--;
                  onHealthChange(h);
                }} style={{ padding:"3px 10px",borderRadius:5,fontSize:10,fontWeight:700,cursor:"pointer",
                  background:"transparent",border:`1px solid ${C.success}`,color:C.success,marginLeft:"auto" }}>
                  Heal →
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }



    // ── Load spell helper (shared by StepSpell and Quick Cast) ───────────────
    function loadSpellData(spell, character, set) {
      const def = spell.defaults || {};
      set("spellName",            spell.name);
      set("spellDescription",     spell.description      || "");
      const method = spellToMethod(spell);
      set("method",               method);
      const mi = CAST_METHODS.find(m=>m.id===method);
      if (mi?.doubleRitual) set("castTime","ritual");
      set("practice",             arcKey(spell.practice)  || "");
      set("defaultPrimaryFactor", spell.primaryFactor    || "potency");
      set("primaryFactor",        spell.primaryFactor    || "potency");
      set("casterArcanum",        arcKey(spell.primaryArcanum));
      set("spellArcanumReq",      spell.primaryArcanumLevel ?? 1);

      if (character?.arcana) {
        const dots = character.arcana[spell.primaryArcanum] || 0;
        if (dots > 0) set("casterArcanumDots", dots);
      }

      if (spell.roteSkill && character) {
        set("roteSkill", SKILL_KEY_TO_LABEL[spell.roteSkill] || "Occult");
        const skillDots = character.skills?.[spell.roteSkill] || 0;
        set("roteSkillDots", skillDots);
        const orderData = character.order ? ORDERS[character.order] : null;
        const orderSkills = orderData ? orderData.roteSkills : [];
        const additionalSkills = character.additionalRoteSkills || [];
        set("orderSkill", orderSkills.includes(spell.roteSkill) || additionalSkills.includes(spell.roteSkill));
      }

      set("potency",              def.potency       ?? 1);
      set("advancedPotency",      def.advancedPotency ?? def.useAdvancedPotency ?? false);
      set("durationIndex",        def.durationIndex ?? 0);
      set("advancedDuration",     def.advancedDuration ?? def.useAdvancedDuration ?? false);
      set("scaleIndex",           def.scaleIndex    ?? 0);
      set("scaleMode",            def.scaleMode     ?? "subjects");
      set("advancedScale",        def.advancedScale ?? def.useAdvancedScale ?? false);
      set("range",                def.range         ?? "touch");
      set("castTime",             mi?.doubleRitual ? "ritual" : (def.castTime ?? "ritual"));
    }

    // ── Clash of Wills ─────────────────────────────────────────────────────────
    const CLASH_DUR_OPTIONS = [
      { id:0, label:"None / Scene", bonus:0 },
      { id:1, label:"Day",          bonus:1 },
      { id:2, label:"Week",         bonus:2 },
      { id:3, label:"Month",        bonus:3 },
      { id:4, label:"Year / Indef", bonus:4 },
    ];

    function ClashOfWills({ character, gnosis, onClose }) {
      const [clashArc, setClashArc]     = useState("");
      const [clashDur, setClashDur]     = useState(0);
      const [clashAdvPot, setClashAdvPot] = useState(false);
      const [clashWP, setClashWP]       = useState(false);
      const [ds, setDs]                 = useState(null);

      // Build arcanum options from character
      const arcOptions = [];
      if (character?.arcana) {
        for (const [key, dots] of Object.entries(character.arcana)) {
          if (dots > 0) arcOptions.push({ key, dots, label: key.charAt(0).toUpperCase() + key.slice(1) });
        }
        arcOptions.sort((a,b) => b.dots - a.dots);
      }
      const selectedArc = clashArc || (arcOptions[0]?.key || "");
      const arcDots = character?.arcana?.[selectedArc] || 0;

      const durBonus = CLASH_DUR_OPTIONS.find(o => o.id === clashDur)?.bonus || 0;
      const pool = gnosis + arcDots + durBonus + (clashAdvPot ? 1 : 0) + (clashWP ? 3 : 0);

      // Breakdown text
      const arcLabel = selectedArc.charAt(0).toUpperCase() + selectedArc.slice(1);
      const parts = [`Gnosis ${gnosis}`, `${arcLabel} ${arcDots}`];
      if (durBonus > 0) parts.push(`Duration +${durBonus}`);
      if (clashAdvPot) parts.push("Adv Potency +1");
      if (clashWP) parts.push("Willpower +3");

      const poolWebhook = character?.discord?.dicePoolWebhook || "";
      const casterName  = character?.shadowName || character?.name || "Mage";

      async function handleSend() {
        if (!poolWebhook) { alert("No Dice Pool webhook set in character.discord.dicePoolWebhook"); return; }
        setDs("sending");
        try {
          await postDiscord(poolWebhook, {
            username: casterName,
            embeds: [{ title: `${casterName}'s Clash of Wills`, color: 0x9d4edd,
              fields: [
                { name: "⚔ Clash Pool", value: String(pool), inline: true },
                { name: "Arcanum", value: `${arcLabel} ${arcDots}`, inline: true },
              ],
              footer: { text: parts.join(" + ") },
            }],
          });
          await postDiscord(poolWebhook, { content: `$cod ${pool}`, username: casterName });
          setDs("ok");
          setTimeout(() => setDs(null), 3000);
        } catch { setDs("error"); setTimeout(() => setDs(null), 4000); }
      }

      return (
        <div style={{ position:"absolute",top:0,left:0,right:0,bottom:0,zIndex:20,
          background:"rgba(0,0,0,0.6)",display:"flex",alignItems:"center",justifyContent:"center",padding:16 }}>
          <div style={{ width:"100%",maxWidth:380,background:C.bgCard,borderRadius:16,
            border:`1px solid ${C.accentBorder}`,overflow:"hidden" }}>

            <div style={{ padding:"12px 16px",background:C.bgDeep,borderBottom:`1px solid ${C.accentBorder}`,
              display:"flex",alignItems:"center",justifyContent:"space-between" }}>
              <div style={{ display:"flex",alignItems:"center",gap:8 }}>
                <span style={{ fontSize:16 }}>⚔</span>
                <span style={{ fontSize:13,fontWeight:700,letterSpacing:2,textTransform:"uppercase",color:C.accentLight }}>Clash of Wills</span>
              </div>
              <span onClick={onClose} style={{ fontSize:11,color:C.textMuted,cursor:"pointer",padding:"4px 8px" }}>✕ Close</span>
            </div>

            <div style={{ padding:"14px 16px" }}>
              <div style={{ display:"grid",gridTemplateColumns:"1fr auto",gap:10,marginBottom:12 }}>
                <div>
                  <Label>Arcanum</Label>
                  <select value={selectedArc} onChange={e=>setClashArc(e.target.value)} style={{
                    width:"100%",padding:8,borderRadius:6,background:C.bgDeep,border:`1px solid ${C.border}`,
                    color:C.text,fontSize:13 }}>
                    {arcOptions.map(a=>(
                      <option key={a.key} value={a.key}>{a.label} ({a.dots})</option>
                    ))}
                    {arcOptions.length===0&&<option value="">No character</option>}
                  </select>
                </div>
                <div>
                  <Label>Gnosis</Label>
                  <div style={{ padding:8,borderRadius:6,background:C.bgDeep,border:`1px solid ${C.border}`,
                    fontSize:13,color:C.accentLight,fontWeight:700,textAlign:"center",minWidth:40 }}>{gnosis}</div>
                </div>
              </div>

              <Label>Spell duration (advanced)</Label>
              <div style={{ display:"flex",flexWrap:"wrap",gap:5,marginBottom:12 }}>
                {CLASH_DUR_OPTIONS.map(opt=>(
                  <button key={opt.id} onClick={()=>setClashDur(opt.id)} style={{
                    padding:"7px 11px",borderRadius:7,fontSize:11,fontWeight:600,cursor:"pointer",
                    border:`1px solid ${clashDur===opt.id?C.accentLight:C.border}`,
                    background:clashDur===opt.id?C.accentFaint:"rgba(255,255,255,0.02)",
                    color:clashDur===opt.id?C.accentLight:C.textMuted,
                  }}>
                    {opt.label}{opt.bonus>0&&<span style={{ color:C.success,fontSize:10,marginLeft:3 }}>+{opt.bonus}</span>}
                  </button>
                ))}
              </div>

              <div style={{ display:"flex",flexDirection:"column",gap:4,marginBottom:14 }}>
                <CheckboxRow label="Advanced Potency" sub="+1 die" checked={clashAdvPot} onChange={setClashAdvPot}/>
                <CheckboxRow label="Spend Willpower" sub="+3 dice" checked={clashWP} onChange={setClashWP}/>
              </div>

              <div style={{ background:C.bgDeep,borderRadius:8,padding:14,textAlign:"center",marginBottom:12 }}>
                <div style={{ fontSize:36,fontWeight:700,color:C.accentLight,lineHeight:1 }}>{pool}</div>
                <div style={{ fontSize:9,letterSpacing:2,textTransform:"uppercase",color:C.textMuted,marginTop:3 }}>Clash dice pool</div>
                <div style={{ marginTop:8,fontSize:11,color:C.textMuted }}>{parts.join(" + ")}</div>
              </div>

              <div style={{ display:"grid",gridTemplateColumns:"1fr 1fr",gap:8 }}>
                <button onClick={handleSend} disabled={!!ds||!poolWebhook} style={{
                  padding:11,borderRadius:8,border:"none",cursor:ds||!poolWebhook?"default":"pointer",
                  background:ds==="ok"?C.success:ds==="error"?C.danger:ds==="sending"?"#666":C.discord,
                  color:"#fff",fontSize:12,fontWeight:700,opacity:!poolWebhook?0.4:1,
                }}>
                  {!poolWebhook?"Send (no webhook)":ds==="ok"?"✓ Sent!":ds==="error"?"✗ Failed":ds==="sending"?"Sending…":"Send to Discord"}
                </button>
                <button onClick={onClose} style={{ padding:11,borderRadius:8,cursor:"pointer",
                  background:"transparent",border:`1px solid ${C.border}`,color:C.textMuted,fontSize:12,fontWeight:700 }}>
                  Close
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ── Initial form state ────────────────────────────────────────────────────
    const INITIAL = {
      gnosis:1, casterArcanum:"Forces", casterArcanumDots:1, spellArcanumReq:1,
      activeSpells:0, roteSkill:"Computer", roteSkillDots:4, orderSkill:false,
      spellName:"", spellDescription:"", method:"improvised", practice:"",
      defaultPrimaryFactor:"potency", primaryFactor:"potency",
      combined:false, combinedSpells:[], separateScales:false,
      potency:1, durationIndex:0, advancedDuration:false, advancedPotency:false,
      scaleIndex:0, scaleMode:"subjects", advancedScale:false,
      range:"touch", castTime:"ritual", ritualIntervals:0, extraReach:0,
      yantras:new Set(), pathToolDedicated:false, orderToolDedicated:false, persona:"0",
      spendWP:false, teamworkDice:0, otherMod:0, extraManaCost:0, againOverride:10,
      prevParadox:0, witnesses:"none", inured:false, mitigateMana:0, paradoxChoice:"contain",
    };

    // ── Suggest Spell Drawer ──────────────────────────────────────────────────
    function SuggestSpellDrawer({ spell, compUser, onClose }) {
      const [sourceBook, setSourceBook]   = useState(spell.sourceBook || '');
      const [description, setDescription] = useState(spell.description || '');
      const [note, setNote]               = useState('');
      const [busy, setBusy]               = useState(false);
      const [done, setDone]               = useState(false);
      const [err,  setErr]                = useState('');

      async function handleSubmit() {
        if (!sourceBook) { setErr('Please select a source book.'); return; }
        setBusy(true); setErr('');
        try {
          await _fsDb.collection('suggestions').add({
            spell: {
              name:                spell.name                || '',
              sourceBook:          sourceBook,
              primaryArcanum:      spell.primaryArcanum      || '',
              primaryArcanumLevel: spell.primaryArcanumLevel || 1,
              secondaryArcanum:    spell.secondaryArcanum    || null,
              secondaryArcanumLevel: spell.secondaryArcanumLevel || null,
              practice:            spell.practice            || '',
              primaryFactor:       spell.primaryFactor       || 'potency',
              withstand:           spell.withstand           || '',
              description:         description,
              reachOptions:        spell.reachOptions        || [],
              optionalArcana:      spell.optionalArcana      || [],
              defaults:            spell.defaults            || {},
            },
            submitterId:   compUser.uid,
            submitterName: compUser.displayName || compUser.email || 'Unknown',
            reviewNote:    note,
            submittedAt:   firebase.firestore.FieldValue.serverTimestamp(),
            status:        'pending',
          });
          setDone(true);
        } catch(e) {
          setErr('Submit failed: ' + e.message);
        } finally {
          setBusy(false);
        }
      }

      return (
        <div style={{ position:"absolute", bottom:0, left:0, right:0, zIndex:300,
          background:C.bgCard, borderTop:`2px solid ${C.accentBorder}`,
          borderRadius:"0 0 20px 20px", padding:"16px 16px 24px",
          boxShadow:"0 -8px 32px rgba(0,0,0,0.5)" }}>

          {done ? (
            <div style={{ textAlign:"center", padding:"12px 0" }}>
              <div style={{ fontSize:28, marginBottom:8 }}>✅</div>
              <div style={{ fontWeight:700, color:C.success, marginBottom:4 }}>Suggestion submitted!</div>
              <div style={{ fontSize:12, color:C.textMuted, marginBottom:14 }}>
                An editor will review "{spell.name}" shortly.
              </div>
              <button onClick={onClose} style={{ padding:"8px 24px", borderRadius:6, fontSize:13,
                fontWeight:600, cursor:"pointer", border:`1px solid ${C.border}`,
                background:"transparent", color:C.textMuted }}>
                Close
              </button>
            </div>
          ) : (
            <>
              <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
                <div>
                  <div style={{ fontWeight:700, fontSize:14, color:C.text }}>💡 Suggest to Compendium</div>
                  <div style={{ fontSize:11, color:C.textMuted, marginTop:2 }}>
                    {spell.name} · {spell.primaryArcanum} {"●".repeat(spell.primaryArcanumLevel||1)}
                  </div>
                </div>
                <button onClick={onClose} style={{ padding:"4px 8px", borderRadius:5, fontSize:14,
                  cursor:"pointer", background:"transparent", border:`1px solid ${C.border}`,
                  color:C.textMuted, lineHeight:1 }}>✕</button>
              </div>

              {/* Source book */}
              <div style={{ marginBottom:10 }}>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:4 }}>Source Book *</div>
                <select value={sourceBook} onChange={e=>setSourceBook(e.target.value)}
                  style={{ width:"100%", padding:"7px 8px", borderRadius:6, fontSize:12,
                    background:C.bgDeep, border:`1px solid ${!sourceBook&&err?C.danger:C.border}`,
                    color:sourceBook?C.text:C.textMuted }}>
                  <option value="">Select book…</option>
                  {Object.entries(COMP_BOOKS).map(([k,v]) => (
                    <option key={k} value={k}>{v.label}</option>
                  ))}
                </select>
              </div>

              {/* Description */}
              <div style={{ marginBottom:10 }}>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:4 }}>Description</div>
                <textarea value={description} onChange={e=>setDescription(e.target.value)}
                  rows={3} placeholder="Spell description from the book…"
                  style={{ width:"100%", padding:"7px 8px", borderRadius:6, fontSize:11,
                    background:C.bgDeep, border:`1px solid ${C.border}`, color:C.text,
                    outline:"none", resize:"vertical", lineHeight:1.5 }}/>
              </div>

              {/* Note to editors */}
              <div style={{ marginBottom:12 }}>
                <div style={{ fontSize:11, color:C.textMuted, marginBottom:4 }}>Note to editors (optional)</div>
                <input value={note} onChange={e=>setNote(e.target.value)}
                  placeholder="e.g. Page 132, double-checked against errata"
                  style={{ width:"100%", padding:"7px 8px", borderRadius:6, fontSize:11,
                    background:C.bgDeep, border:`1px solid ${C.border}`, color:C.text, outline:"none" }}/>
              </div>

              {err && <div style={{ fontSize:11, color:C.danger, marginBottom:8 }}>{err}</div>}

              <div style={{ display:"flex", gap:8 }}>
                <button onClick={onClose} style={{ flex:1, padding:"9px 0", borderRadius:6,
                  fontSize:12, fontWeight:600, cursor:"pointer",
                  background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted }}>
                  Cancel
                </button>
                <button onClick={handleSubmit} disabled={busy}
                  style={{ flex:2, padding:"9px 0", borderRadius:6, fontSize:12, fontWeight:600,
                    cursor:busy?"not-allowed":"pointer", border:"none",
                    background:`linear-gradient(135deg,${C.accent},${C.accentLight})`,
                    color:"#fff", opacity:busy?0.6:1,
                    boxShadow:`0 3px 10px rgba(123,44,191,0.35)` }}>
                  {busy ? "Submitting…" : "Submit Suggestion"}
                </button>
              </div>
            </>
          )}
        </div>
      );
    }

    // ── Compendium Overlay (read-only browse + add to library) ───────────────
    function CompendiumOverlay({ character, compUser, compRole, onAddSpell, onClose }) {
      const [spells, setSpells]           = useState([]);
      const [loading, setLoading]         = useState(true);
      const [search, setSearch]           = useState('');
      const [filterBook, setFilterBook]   = useState('all');
      const [filterArc, setFilterArc]     = useState('all');
      const [expandedId, setExpandedId]   = useState(null);
      const [addingSpell, setAddingSpell] = useState(null);
      const [addType, setAddType]         = useState('praxis');
      const [roteSkill, setRoteSkill]     = useState('occult');
      const [roteCreator, setRoteCreator] = useState('');
      const [signBusy, setSignBusy]       = useState(false);
      const [addFeedback, setAddFeedback] = useState({}); // spellId -> 'rote'|'praxis'|'favorite'

      useEffect(() => {
        setLoading(true);
        const unsubscribe = _fsDb.collection('compendium')
          .orderBy('name')
          .onSnapshot(snap => {
            const items = [];
            snap.forEach(doc => items.push({ id: doc.id, ...doc.data() }));
            items.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
            setSpells(items);
            setLoading(false);
          }, err => {
            console.error('Compendium fetch error:', err);
            setLoading(false);
          });
        return () => unsubscribe();
      }, []);

      function handleSignIn() {
        setSignBusy(true);
        const provider = new firebase.auth.GoogleAuthProvider();
        _fsAuth.signInWithPopup(provider).catch(e => console.error(e)).finally(() => setSignBusy(false));
      }
      function handleSignOut() { _fsAuth.signOut(); }

      function isAdded(spell, type) {
        if (!character) return false;
        const arr = type === 'rote' ? (character.rotes || [])
                  : type === 'praxis' ? (character.praxes || [])
                  : (character.improvisedFavorites || []);
        return arr.some(s => s.compendiumId === spell.id);
      }
      function anyAdded(spell) {
        return isAdded(spell,'rote') || isAdded(spell,'praxis') || isAdded(spell,'favorite');
      }

      function openAdd(spell) {
        setAddType('praxis');
        setRoteSkill('occult');
        setRoteCreator('');
        setAddingSpell(spell);
      }
      function confirmAdd() {
        if (!addingSpell || !character) return;
        const spellId = addingSpell.id;
        const spellType = addType;
        onAddSpell(addingSpell, spellType, spellType === 'rote' ? roteSkill : null, spellType === 'rote' ? roteCreator : null);
        setAddFeedback(prev => ({ ...prev, [spellId]: spellType }));
        setAddingSpell(null);
        setTimeout(() => setAddFeedback(prev => { const n = {...prev}; delete n[spellId]; return n; }), 3000);
      }

      const filtered = spells.filter(s => {
        if (filterBook !== 'all' && s.sourceBook !== filterBook) return false;
        if (filterArc  !== 'all' && (s.primaryArcanum||'').toLowerCase() !== filterArc.toLowerCase()) return false;
        if (search) {
          const q = search.toLowerCase();
          if (!(s.name||'').toLowerCase().includes(q) && !(s.description||'').toLowerCase().includes(q)) return false;
        }
        return true;
      });

      const roleBadgeColor = { admin:'#c73e1d', editor:'#2a9d8f', 'sub-editor':'#e9c46a', suggester:'#9d4edd' };

      return (
        <div style={{ position:"absolute", inset:0, zIndex:200, background:C.bgDark,
          display:"flex", flexDirection:"column", borderRadius:20, overflow:"hidden" }}>

          {/* Header */}
          <div style={{ padding:"10px 14px 9px", background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})`,
            borderBottom:`1px solid ${C.accentBorder}`, display:"flex", alignItems:"center", gap:8, flexShrink:0 }}>
            <span style={{ fontSize:16 }}>📖</span>
            <span style={{ fontFamily:"'Rajdhani',sans-serif", fontSize:15, fontWeight:700,
              letterSpacing:2, textTransform:"uppercase", color:C.accentLight, flex:1 }}>
              Spell Compendium
            </span>
            {/* Auth */}
            {compUser ? (
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                {compRole && compRole !== 'player' && (
                  <span style={{ fontSize:9, fontWeight:700, textTransform:"uppercase", letterSpacing:.8,
                    padding:"2px 6px", borderRadius:4,
                    background: roleBadgeColor[compRole] ? roleBadgeColor[compRole]+'33' : C.accentFaint,
                    color: roleBadgeColor[compRole] || C.accentLight, border:`1px solid ${roleBadgeColor[compRole]||C.accentBorder}44` }}>
                    {compRole}
                  </span>
                )}
                <button onClick={handleSignOut} style={{ padding:"3px 8px", borderRadius:5, fontSize:10,
                  cursor:"pointer", background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted }}>
                  Sign Out
                </button>
              </div>
            ) : (
              <button onClick={handleSignIn} disabled={signBusy} style={{ padding:"4px 10px", borderRadius:5,
                fontSize:11, fontWeight:600, cursor:signBusy?"not-allowed":"pointer",
                background:"rgba(66,133,244,0.15)", border:"1px solid rgba(66,133,244,0.4)",
                color:"#4285F4", opacity:signBusy?0.6:1 }}>
                {signBusy ? "…" : "🔑 Sign In"}
              </button>
            )}
            <button onClick={onClose} style={{ padding:"4px 8px", borderRadius:5, fontSize:14,
              cursor:"pointer", background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted,
              lineHeight:1, marginLeft:2 }}>✕</button>
          </div>

          {/* Search + Filters */}
          <div style={{ padding:"8px 12px", background:C.bgCard, borderBottom:`1px solid ${C.border}`,
            display:"flex", flexDirection:"column", gap:6, flexShrink:0 }}>
            <input value={search} onChange={e=>setSearch(e.target.value)}
              placeholder="Search spells…"
              style={{ width:"100%", padding:"7px 10px", borderRadius:6, fontSize:12,
                background:C.bgDeep, border:`1px solid ${C.accentBorder}`, color:C.text,
                outline:"none" }}/>
            <div style={{ display:"flex", gap:6 }}>
              <select value={filterBook} onChange={e=>setFilterBook(e.target.value)}
                style={{ flex:1, padding:"5px 6px", borderRadius:5, fontSize:11,
                  background:C.bgDeep, border:`1px solid ${C.border}`, color:C.text }}>
                <option value="all">All Books</option>
                {Object.entries(COMP_BOOKS).map(([k,v]) => (
                  <option key={k} value={k}>{v.short}</option>
                ))}
              </select>
              <select value={filterArc} onChange={e=>setFilterArc(e.target.value)}
                style={{ flex:1, padding:"5px 6px", borderRadius:5, fontSize:11,
                  background:C.bgDeep, border:`1px solid ${C.border}`, color:C.text }}>
                <option value="all">All Arcana</option>
                {ARCANA.map(a => <option key={a} value={a}>{a}</option>)}
              </select>
            </div>
          </div>

          {/* Spell count */}
          <div style={{ padding:"4px 14px", fontSize:10, color:C.textMuted, background:C.bgCard,
            borderBottom:`1px solid ${C.borderLight}`, flexShrink:0 }}>
            {loading ? "Loading…" : `${filtered.length} spell${filtered.length!==1?'s':''} found`}
          </div>

          {/* Spell list */}
          <div style={{ flex:1, overflowY:"auto", padding:"8px 10px" }}>
            {loading && (
              <div style={{ textAlign:"center", color:C.textMuted, padding:40, fontSize:13 }}>
                Loading compendium…
              </div>
            )}
            {!loading && filtered.length === 0 && (
              <div style={{ textAlign:"center", color:C.textMuted, padding:40, fontSize:13 }}>
                No spells match your filters.
              </div>
            )}
            {!loading && filtered.map(spell => {
              const book = COMP_BOOKS[spell.sourceBook];
              const isExpanded = expandedId === spell.id;
              const added = anyAdded(spell);
              const justAdded = addFeedback[spell.id];
              return (
                <div key={spell.id} style={{ marginBottom:8, borderRadius:8,
                  background:C.bgCard, border:`1px solid ${isExpanded ? C.accentBorder : C.border}`,
                  overflow:"hidden", transition:"border-color .2s" }}>

                  {/* Card header — tap to expand */}
                  <div onClick={() => setExpandedId(isExpanded ? null : spell.id)}
                    style={{ padding:"9px 11px", display:"flex", alignItems:"center", gap:8, cursor:"pointer" }}>
                    {/* Source badge */}
                    {book && (
                      <span style={{ fontSize:9, fontWeight:700, padding:"2px 5px", borderRadius:3,
                        background: book.color+'22', color:book.color, border:`1px solid ${book.color}44`,
                        textTransform:"uppercase", letterSpacing:.6, flexShrink:0 }}>
                        {book.short}
                      </span>
                    )}
                    <span style={{ fontWeight:600, fontSize:13, color: added ? C.accentLight : C.text, flex:1 }}>
                      {spell.name}
                    </span>
                    <span style={{ fontSize:10, color:C.textMuted, flexShrink:0 }}>
                      {spell.primaryArcanum} {spell.primaryArcanumLevel ? '●'.repeat(spell.primaryArcanumLevel) : ''}
                    </span>
                    <span style={{ fontSize:11, color:C.textMuted, flexShrink:0, marginLeft:4 }}>
                      {isExpanded ? '▲' : '▼'}
                    </span>
                  </div>

                  {/* Expanded details */}
                  {isExpanded && (
                    <div style={{ padding:"0 11px 11px", borderTop:`1px solid ${C.borderLight}` }}>
                      <div style={{ display:"flex", flexWrap:"wrap", gap:4, margin:"8px 0 6px" }}>
                        {spell.practice && (
                          <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4,
                            background:C.accentFaint, color:C.accentLight, border:`1px solid ${C.accentBorder}` }}>
                            {spell.practice}
                          </span>
                        )}
                        {spell.primaryFactor && (
                          <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4,
                            background:"rgba(42,157,143,0.15)", color:C.success, border:"1px solid rgba(42,157,143,0.3)" }}>
                            Factor: {spell.primaryFactor}
                          </span>
                        )}
                        {spell.withstand && (
                          <span style={{ fontSize:10, padding:"2px 7px", borderRadius:4,
                            background:"rgba(199,62,29,0.12)", color:C.danger, border:"1px solid rgba(199,62,29,0.25)" }}>
                            Withstand: {spell.withstand}
                          </span>
                        )}
                      </div>
                      {spell.description && (
                        <p style={{ fontSize:11, color:C.textMuted, lineHeight:1.55, marginBottom:8 }}>
                          {spell.description}
                        </p>
                      )}
                      {spell.reachOptions && spell.reachOptions.length > 0 && (
                        <div style={{ marginBottom:8 }}>
                          <div style={{ fontSize:10, color:C.accentLight, fontWeight:600, marginBottom:3 }}>
                            Reach Options
                          </div>
                          {spell.reachOptions.map((r, i) => (
                            <div key={i} style={{ fontSize:10, color:C.textMuted, paddingLeft:8,
                              borderLeft:`2px solid ${C.accentBorder}`, marginBottom:2 }}>
                              {r}
                            </div>
                          ))}
                        </div>
                      )}
                      {spell.optionalArcana && spell.optionalArcana.length > 0 && (
                        <div style={{ marginBottom:8 }}>
                          <div style={{ fontSize:10, color:C.warning, fontWeight:600, marginBottom:3 }}>
                            Optional Arcana
                          </div>
                          {spell.optionalArcana.map((oa, i) => (
                            <div key={i} style={{ fontSize:10, color:C.textMuted, paddingLeft:8,
                              borderLeft:`2px solid rgba(233,196,106,0.4)`, marginBottom:2 }}>
                              {oa.arcanum} {oa.level ? '●'.repeat(oa.level) : ''}{oa.effect ? ` — ${oa.effect}` : ''}
                            </div>
                          ))}
                        </div>
                      )}
                      {/* Add to Library button */}
                      {character ? (
                        justAdded ? (
                          <div style={{ textAlign:"center", fontSize:11, color:C.success, padding:"6px 0" }}>
                            ✓ Added as {justAdded}!
                          </div>
                        ) : (
                          <button onClick={() => openAdd(spell)}
                            style={{ width:"100%", padding:"8px 0", borderRadius:6, fontSize:12, fontWeight:600,
                              cursor:"pointer", border:"none",
                              background:`linear-gradient(135deg,${C.accent},${C.accentLight})`,
                              color:"#fff", boxShadow:`0 3px 10px rgba(123,44,191,0.35)` }}>
                            {added ? "✚ Add Again" : "✚ Add to Grimoire"}
                          </button>
                        )
                      ) : (
                        <div style={{ textAlign:"center", fontSize:11, color:C.textMuted, padding:"6px 0",
                          fontStyle:"italic" }}>
                          Load a character to add spells
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
            <div style={{ height:20 }}/>
          </div>

          {/* Add to Library drawer */}
          {addingSpell && (
            <div style={{ position:"absolute", bottom:0, left:0, right:0, zIndex:210,
              background:C.bgCard, borderTop:`2px solid ${C.accentBorder}`,
              borderRadius:"0 0 20px 20px", padding:"14px 16px 20px" }}>
              <div style={{ fontWeight:700, fontSize:14, color:C.text, marginBottom:10 }}>
                Add "{addingSpell.name}"
              </div>
              {/* Type selector */}
              <div style={{ display:"flex", gap:6, marginBottom:10 }}>
                {['rote','praxis','favorite'].map(t => {
                  const already = isAdded(addingSpell, t);
                  return (
                    <button key={t} onClick={() => !already && setAddType(t)}
                      style={{ flex:1, padding:"7px 0", borderRadius:6, fontSize:11, fontWeight:600,
                        cursor: already ? "not-allowed" : "pointer",
                        border:`1px solid ${addType===t ? C.accentBorder : C.border}`,
                        background: already ? C.accentFaint : addType===t ? C.accentFaint : "transparent",
                        color: already ? C.accentLight : addType===t ? C.accentLight : C.textMuted,
                        opacity: already ? 0.6 : 1 }}>
                      {already ? "✓" : ""} {t.charAt(0).toUpperCase()+t.slice(1)}
                    </button>
                  );
                })}
              </div>
              {/* Rote extras */}
              {addType === 'rote' && (
                <div style={{ marginBottom:10 }}>
                  <select value={roteSkill} onChange={e=>setRoteSkill(e.target.value)}
                    style={{ width:"100%", padding:"6px 8px", borderRadius:5, fontSize:11, marginBottom:6,
                      background:C.bgDeep, border:`1px solid ${C.border}`, color:C.text }}>
                    {ROTE_SKILLS.map(sk => (
                      <option key={sk} value={LABEL_TO_SKILL_KEY[sk]||sk.toLowerCase()}>{sk}</option>
                    ))}
                  </select>
                  <input value={roteCreator} onChange={e=>setRoteCreator(e.target.value)}
                    placeholder="Creator / Order (optional)"
                    style={{ width:"100%", padding:"6px 8px", borderRadius:5, fontSize:11,
                      background:C.bgDeep, border:`1px solid ${C.border}`, color:C.text, outline:"none" }}/>
                </div>
              )}
              <div style={{ display:"flex", gap:8 }}>
                <button onClick={() => setAddingSpell(null)}
                  style={{ flex:1, padding:"9px 0", borderRadius:6, fontSize:12, fontWeight:600,
                    cursor:"pointer", background:"transparent", border:`1px solid ${C.border}`, color:C.textMuted }}>
                  Cancel
                </button>
                <button onClick={confirmAdd}
                  style={{ flex:2, padding:"9px 0", borderRadius:6, fontSize:12, fontWeight:600,
                    cursor:"pointer", border:"none",
                    background:`linear-gradient(135deg,${C.accent},${C.accentLight})`,
                    color:"#fff", boxShadow:`0 3px 10px rgba(123,44,191,0.35)` }}>
                  ✓ Confirm
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── App root ──────────────────────────────────────────────────────────────
    function FirstRunScreen({ onLoad, onNew, onDismiss }) {
      return (
        <div style={{ display:"flex",flexDirection:"column",alignItems:"center",
          justifyContent:"center",padding:"40px 24px",minHeight:"60vh",textAlign:"center",
          position:"relative" }}>
          <button onClick={onDismiss} style={{ position:"absolute",top:8,right:8,
            background:"transparent",border:"none",color:C.textMuted,fontSize:20,
            cursor:"pointer",padding:8,lineHeight:1 }}
            aria-label="Dismiss">&times;</button>
          <div style={{ fontSize:48,marginBottom:16,opacity:0.6 }}>⟡</div>
          <h2 style={{ fontFamily:"'Rajdhani',sans-serif",fontSize:26,fontWeight:700,
            color:C.accentLight,marginBottom:8,letterSpacing:1 }}>
            Welcome to the Spell Wizard
          </h2>
          <p style={{ color:C.textMuted,fontSize:13,lineHeight:1.7,maxWidth:280,marginBottom:32 }}>
            Load a character JSON to get started, or create a new one.
          </p>
          <button onClick={onLoad} style={{ width:"100%",maxWidth:280,padding:"14px",
            borderRadius:10,cursor:"pointer",fontSize:15,fontWeight:700,
            background:C.accent,border:"none",color:"#fff",marginBottom:10 }}>
            Load Character
          </button>
          <button onClick={onNew} style={{ width:"100%",maxWidth:280,padding:"12px",
            borderRadius:10,cursor:"pointer",fontSize:13,fontWeight:600,
            background:"transparent",border:`1px solid ${C.border}`,
            color:C.textMuted }}>
            New Character
          </button>
          <p style={{ color:C.textMuted,fontSize:11,marginTop:24,opacity:0.6 }}>
            Your character is stored locally — never uploaded.
          </p>
        </div>
      );
    }

    function App() {
      const [d, setD]               = useState(INITIAL);
      const [stepIdx, setStepIdx]   = useState(0);
      const [miniExpanded, setMini] = useState(false);
      const [character, setChar]    = useState(null);
      const [clashOpen, setClashOpen]   = useState(false);
      const [activeSpells, setActiveSpells] = useState([]);
      const [sheetOpen,    setSheetOpen]    = useState(false);
      const [sceneOpen,    setSceneOpen]    = useState(false);
      const [sceneConn,    setSceneConn]    = useState(null); // { code, playerId } or null
      const [saveLibOpen,  setSaveLibOpen]  = useState(false);
      const [sourceSpellId, setSourceSpellId]       = useState(null);
      const [sourceRoteSkillKey, setSourceRoteKey]  = useState(null);
      const [compOpen, setCompOpen]     = useState(false);
      const [compUser, setCompUser]     = useState(null);
      const [compRole, setCompRole]     = useState('player');
      const [suggestSpell, setSuggestSpell] = useState(null);
      const [myTilts, setMyTilts] = useState([]);
      const castPoolRef = useRef(null);
      const firstRunDismissed = useRef(false);
      const [dismissed, setDismissed] = useState(() => {
        try { return !!localStorage.getItem('mage_current_character'); } catch { return false; }
      });
      const [justSaved, setJustSaved] = useState(false);
      const charFileRef = useRef(null);

      const set = useCallback((key, val) => setD(prev => ({...prev, [key]:val})), []);

      useEffect(() => {
        if (!character) return;
        setJustSaved(true);
        const t = setTimeout(() => setJustSaved(false), 2000);
        return () => clearTimeout(t);
      }, [character]);

      // ── Firebase Auth state listener ──────────────────────────────────────
      useEffect(() => {
        const unsubscribe = _fsAuth.onAuthStateChanged(async (user) => {
          setCompUser(user);
          if (user) {
            try {
              const doc = await _fsDb.collection('userRoles').doc(user.uid).get();
              setCompRole(doc.exists ? (doc.data().role || 'player') : 'player');
            } catch(e) { setCompRole('player'); }
          } else {
            setCompRole('player');
          }
        });
        return () => unsubscribe();
      }, []);

      function handleLoad(char) {
        setChar(char);
        applyCharacterToForm(char, setD);
        setActiveSpells(char.activeSpells || []);
        if (sceneConn) { scenePushStats(sceneConn.code, sceneConn.playerId, char); sessionPushSheet(sceneConn.code, sceneConn.playerId, char); }
      }
      
      function addActiveSpellWizard(snapshot) {
        const newSpell = {
          id:           'as_' + Date.now(),
          name:         snapshot.name         || 'Unnamed Spell',
          arcanum:      snapshot.arcanum      || 'prime',
          arcanumLevel: snapshot.arcanumLevel || 1,
          castMethod:   snapshot.castMethod   || 'improvised',
          potency:      snapshot.potency      || 1,
          duration:     snapshot.duration     || '—',
          scale:        snapshot.scale        || '—',
          reach:        snapshot.reach        || 0,
          mana:         snapshot.mana         || 0,
          addedAt:      new Date().toISOString(),
        };
        const next = [...activeSpells, newSpell];
        setActiveSpells(next);
        set('activeSpells', next.length);
        if (character) {
          character.activeSpells = next;
          try { localStorage.setItem('mage_current_character', JSON.stringify(character)); } catch(e){}
          if (sceneConn) scenePushStats(sceneConn.code, sceneConn.playerId, character);
        }
      }

      function dismissActiveSpellWizard(id) {
        const next = activeSpells.filter(s => s.id !== id);
        setActiveSpells(next);
        set('activeSpells', next.length);
        if (character) {
          character.activeSpells = next;
          try { localStorage.setItem('mage_current_character', JSON.stringify(character)); } catch(e){}
          if (sceneConn) scenePushStats(sceneConn.code, sceneConn.playerId, character);
        }
      }
      
      function handleSave() {
        if (!character) return;
        const blob = new Blob([JSON.stringify(character, null, 2)], { type:"application/json" });
        const url  = URL.createObjectURL(blob);
        const a    = document.createElement("a");
        a.href = url;
        a.download = `${(character.shadowName||character.name||"character").replace(/\s+/g,"-")}.json`;
        a.click();
        URL.revokeObjectURL(url);
      }
      function handleNew() {
        const blank = {
          name:"New Mage", shadowName:"", path:"", order:"", gnosis:1, wisdom:7,
          mana:{current:10,max:10}, willpower:{current:5,max:5},
          health:{max:7,bashing:0,lethal:0,aggravated:0},
          arcana:{death:0,fate:0,forces:0,life:0,matter:0,mind:0,prime:0,space:0,spirit:0,time:0},
          skills:{}, rotes:[], praxes:[], improvisedFavorites:[], activeSpells:[],
          discord:{spellPreviewWebhook:"",dicePoolWebhook:""},
        };
        setChar(blank);
        setD({...INITIAL, yantras:new Set()});
        setSourceSpellId(null);
        setSourceRoteKey(null);
        setStepIdx(0);
      }
      function handleNewSpell() {
        // Reset spell form to defaults but keep the loaded character
        setD({...INITIAL, yantras:new Set()});
        if (character) applyCharacterToForm(character, setD);
        setSourceSpellId(null);
        setSourceRoteKey(null);
        setStepIdx(0);
      }
      function handleSceneUpdate(info) {
        // info = { code, playerId, connected, myRolls, myStAdj, stStatEdit, myTilts } or null
        if (!info || !info.connected) {
          setSceneConn(null);
          setMyTilts([]);
          return;
        }
        setSceneConn({ code: info.code, playerId: info.playerId });
        setMyTilts(info.myTilts || []);
        // Auto-sync prevParadox from Firebase when connected
        const eff = Math.max(0, (info.myRolls || 0) + (info.myStAdj || 0));
        setD(prev => prev.prevParadox !== eff ? { ...prev, prevParadox: eff } : prev);
        // Apply ST stat override to local character then re-broadcast
        if (info.stStatEdit) {
          setChar(prev => {
            if (!prev) return prev;
            const edit = info.stStatEdit;
            const next = { ...prev };
            if (edit.health)    next.health    = { ...prev.health,    ...edit.health };
            if (edit.mana)      next.mana      = { ...prev.mana,      ...edit.mana };
            if (edit.willpower) next.willpower = { ...prev.willpower, ...edit.willpower };
            // Re-broadcast updated stats so ST sees the acknowledged values
            setTimeout(() => scenePushStats(info.code, info.playerId, next), 100);
            return next;
          });
        }
        // Apply ST sheet override (arcana, etc.) then re-broadcast sheet
        if (info.stSheetEdit) {
          setChar(prev => {
            if (!prev) return prev;
            const edit = info.stSheetEdit;
            const next = { ...prev };
            if (edit.arcana) next.arcana = { ...prev.arcana, ...edit.arcana };
            try { localStorage.setItem('mage_current_character', JSON.stringify(next)); } catch(e){}
            setTimeout(() => sessionPushSheet(info.code, info.playerId, next), 100);
            return next;
          });
        }
      }
      function handleManaChange(newMana) {
        if (!character) return;
        const updated = {...character, mana:{...character.mana, current:newMana}};
        setChar(updated);
        if (sceneConn) scenePushStats(sceneConn.code, sceneConn.playerId, updated);
      }
      function handleHealthChange(newHealth) {
        if (!character) return;
        const updated = {...character, health: newHealth};
        setChar(updated);
        try { localStorage.setItem('mage_current_character', JSON.stringify(updated)); } catch(e){}
        if (sceneConn) scenePushStats(sceneConn.code, sceneConn.playerId, updated);
      }
      function handleWillpowerChange(newWP) {
        if (!character) return;
        const updated = {...character, willpower: {...character.willpower, current: newWP}};
        setChar(updated);
        try { localStorage.setItem('mage_current_character', JSON.stringify(updated)); } catch(e){}
        if (sceneConn) scenePushStats(sceneConn.code, sceneConn.playerId, updated);
      }
      function onSpellLoaded(spell) {
        setSourceSpellId(spell.id || null);
        setSourceRoteKey(spell.roteSkill || null);
      }

      function handleSaveToLibrary({ spellData, defaults, type, isUpdate, sourceSpellId: srcId }) {
        if (!character) return;
        const genId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
        const fullSpell = {
          id: isUpdate ? srcId : genId(),
          type: type,
          name: spellData.name,
          primaryArcanum: spellData.primaryArcanum,
          primaryArcanumLevel: spellData.primaryArcanumLevel,
          secondaryArcanum: spellData.secondaryArcanum,
          secondaryArcanumLevel: spellData.secondaryArcanumLevel,
          practice: spellData.practice,
          primaryFactor: spellData.primaryFactor,
          withstand: spellData.withstand || "",
          description: spellData.description || "",
          reachOptions: spellData.reachOptions || [],
          defaults: { ...defaults },
        };
        if (type === "rote") {
          fullSpell.roteSkill = spellData.roteSkill || "occult";
          fullSpell.roteCreator = spellData.roteCreator || "order";
        }
        const updated = { ...character };
        if (isUpdate && srcId) {
          updated.rotes = (updated.rotes || []).filter(s => s.id !== srcId);
          updated.praxes = (updated.praxes || []).filter(s => s.id !== srcId);
          updated.improvisedFavorites = (updated.improvisedFavorites || []).filter(s => s.id !== srcId);
        }
        if (type === "rote") {
          if (!updated.rotes) updated.rotes = [];
          updated.rotes.push(fullSpell);
        } else if (type === "praxis") {
          if (!updated.praxes) updated.praxes = [];
          updated.praxes.push(fullSpell);
        } else {
          if (!updated.improvisedFavorites) updated.improvisedFavorites = [];
          updated.improvisedFavorites.push(fullSpell);
        }
        setChar(updated);
        setSourceSpellId(fullSpell.id);
        setSourceRoteKey(fullSpell.roteSkill || null);
        try { localStorage.setItem('mage_current_character', JSON.stringify(updated)); } catch(e){}
        if (sceneConn) sessionPushSheet(sceneConn.code, sceneConn.playerId, updated);
      }

      function handleCompendiumAddSpell(compSpell, type, roteSkill, roteCreator) {
        if (!character) return;
        const genId = () => Date.now().toString(36) + Math.random().toString(36).substr(2);
        const fullSpell = {
          id: genId(),
          compendiumId: compSpell.id,
          type,
          name: compSpell.name,
          primaryArcanum: compSpell.primaryArcanum || '',
          primaryArcanumLevel: compSpell.primaryArcanumLevel || 1,
          secondaryArcanum: compSpell.secondaryArcanum || '',
          secondaryArcanumLevel: compSpell.secondaryArcanumLevel || 0,
          practice: compSpell.practice || '',
          primaryFactor: compSpell.primaryFactor || 'potency',
          withstand: compSpell.withstand || '',
          description: compSpell.description || '',
          reachOptions: compSpell.reachOptions || [],
          defaults: compSpell.defaults || {},
        };
        if (type === 'rote') {
          fullSpell.roteSkill = roteSkill || 'occult';
          fullSpell.roteCreator = roteCreator || '';
        }
        const updated = { ...character };
        if (type === 'rote') {
          if (!updated.rotes) updated.rotes = [];
          updated.rotes.push(fullSpell);
        } else if (type === 'praxis') {
          if (!updated.praxes) updated.praxes = [];
          updated.praxes.push(fullSpell);
        } else {
          if (!updated.improvisedFavorites) updated.improvisedFavorites = [];
          updated.improvisedFavorites.push(fullSpell);
        }
        setChar(updated);
        try { localStorage.setItem('mage_current_character', JSON.stringify(updated)); } catch(e) {}
        if (sceneConn) sessionPushSheet(sceneConn.code, sceneConn.playerId, updated);
      }

      const steps = d.combined
        ? [BASE_STEPS[0], BASE_STEPS[1], {id:"combined",label:"Combined",icon:"⊞"}, ...BASE_STEPS.slice(2)]
        : BASE_STEPS;

      const currentStep = steps[stepIdx];
      const derived     = deriveValues(d, character);

      function renderStep() {
        switch(currentStep.id) {
          case "caster":    return <StepCaster    d={d} set={set} character={character} onClash={()=>setClashOpen(true)}/>;
          case "spell":     return <StepSpell     d={d} set={set} character={character} onSpellLoaded={onSpellLoaded} compUser={compUser} onSuggest={spell=>setSuggestSpell(spell)}/>;
          case "combined":  return <StepCombined  d={d} set={set} character={character}/>;
          case "factors":   return <StepFactors   d={d} set={set} derived={derived}/>;
          case "yantras":   return <StepYantras   d={d} set={set}/>;
          case "modifiers": return <StepModifiers d={d} set={set} derived={derived} character={character} sceneConn={sceneConn}/>;
          case 'cast':      return <StepCast d={d} derived={derived} character={character} onManaChange={handleManaChange} onSetActive={addActiveSpellWizard} onOpenSheet={()=>setSheetOpen(true)} sceneConn={sceneConn} onSaveToLibrary={()=>setSaveLibOpen(true)} poolActionRef={castPoolRef}/>;
          default:          return null;
        }
      }

      const showFirstRun = !character && !dismissed && !firstRunDismissed.current;

      function handleFirstRunLoad() {
        charFileRef.current?.click();
        firstRunDismissed.current = true;
        setDismissed(true);
      }
      function handleFirstRunNew() {
        handleNew();
        firstRunDismissed.current = true;
        setDismissed(true);
      }
      function handleFirstRunDismiss() {
        firstRunDismissed.current = true;
        setDismissed(true);
      }
      function handleFirstRunFileChange(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          try { handleLoad(JSON.parse(ev.target.result)); }
          catch { alert("Invalid character file — could not parse JSON."); }
        };
        reader.readAsText(file);
        e.target.value = "";
      }

      return (
        <div style={{ minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",
          background:"radial-gradient(ellipse at 50% 30%,#1a0a2e 0%,#0d0d1a 60%)",padding:"20px 12px" }}>

          <input type="file" accept=".json" ref={charFileRef} onChange={handleFirstRunFileChange} style={{ display:"none" }}/>

          <div style={{ width:"100%",maxWidth:440,background:C.bgDark,borderRadius:20,
            border:`1px solid ${C.accentBorder}`,
            boxShadow:`0 0 60px rgba(123,44,191,0.12),0 30px 80px rgba(0,0,0,0.7)`,
            display:"flex",flexDirection:"column",minHeight:750,overflow:"hidden",position:"relative" }}>

          {showFirstRun ? (
            <FirstRunScreen onLoad={handleFirstRunLoad} onNew={handleFirstRunNew} onDismiss={handleFirstRunDismiss}/>
          ) : (<>

        {clashOpen && <ClashOfWills character={character} gnosis={d.gnosis} onClose={()=>setClashOpen(false)}/>}
            {compOpen && (
              <CompendiumOverlay
                character={character}
                compUser={compUser}
                compRole={compRole}
                onAddSpell={handleCompendiumAddSpell}
                onClose={() => setCompOpen(false)}
              />
            )}
            {suggestSpell && (
              <SuggestSpellDrawer
                spell={suggestSpell}
                compUser={compUser}
                onClose={() => setSuggestSpell(null)}
              />
            )}
            {sheetOpen && (
              <ActiveSpellsDrawer
                spells={activeSpells}
                onDismiss={dismissActiveSpellWizard}
                onClose={() => setSheetOpen(false)}
              />
            )}
            {saveLibOpen && (
              <SaveToLibraryDrawer
                d={d}
                character={character}
                sourceSpellId={sourceSpellId}
                sourceRoteSkillKey={sourceRoteSkillKey}
                onSave={(data) => { handleSaveToLibrary(data); setSaveLibOpen(false); }}
                onClose={() => setSaveLibOpen(false)}
              />
            )}
              <SceneDrawer
                open={sceneOpen}
                onClose={() => setSceneOpen(false)}
                character={character}
                onSceneUpdate={handleSceneUpdate}
              />
            {/* Title bar */}
            <div style={{ padding:"11px 16px 9px",
              background:`linear-gradient(90deg,${C.bgDeep},${C.bgCard})`,
              borderBottom:`1px solid ${C.accentBorder}`,textAlign:"center" }}>
              <h1 style={{ fontFamily:"'Rajdhani',sans-serif",fontSize:14,fontWeight:700,
                letterSpacing:3,textTransform:"uppercase",color:C.accentLight }}>
                ⟡ Spell Factor Calculator ⟡
              </h1>
            </div>

            <CharacterHeader
              character={character}
              onLoad={handleLoad}
              onSave={handleSave}
              onNew={handleNew}
              onManaChange={handleManaChange}
              onHealthChange={handleHealthChange}
              onWillpowerChange={handleWillpowerChange}
              activeCount={activeSpells.length}
              onSheetToggle={() => setSheetOpen(o => !o)}
              onSceneToggle={() => setSceneOpen(o => !o)}
              sceneConnected={!!sceneConn}
              onCompendiumToggle={() => setCompOpen(o => !o)}
              compUser={compUser}
              justSaved={justSaved}
            />

            {/* ST-applied tilts banner */}
            {myTilts.length > 0 && (
              <div style={{ padding:"5px 14px", background:"rgba(230,57,70,0.08)",
                borderBottom:"1px solid rgba(230,57,70,0.25)",
                display:"flex", flexWrap:"wrap", gap:5, alignItems:"center" }}>
                <span style={{ fontSize:9, letterSpacing:1, textTransform:"uppercase",
                  color:"#e63946", fontWeight:700, marginRight:2 }}>Tilts</span>
                {myTilts.map((tilt, i) => (
                  <span key={i} style={{ fontSize:11, padding:"2px 9px", borderRadius:10,
                    background:"rgba(230,57,70,0.15)", border:"1px solid rgba(230,57,70,0.35)",
                    color:"#e63946" }}>
                    {tilt}
                  </span>
                ))}
              </div>
            )}

            {/* Step indicator */}
            <div style={{ padding:"10px 16px 4px",background:C.bgCard,borderBottom:`1px solid ${C.border}` }}>
              <div style={{ display:"flex",alignItems:"flex-start",gap:2 }}>
                {steps.map((s,i)=>(
                  <div key={s.id} onClick={()=>i<stepIdx&&setStepIdx(i)}
                    style={{ flex:1,cursor:i<stepIdx?"pointer":"default",display:"flex",flexDirection:"column",alignItems:"center",gap:3,position:"relative" }}>
                    {i<steps.length-1&&<div style={{ position:"absolute",top:14,left:"50%",width:"100%",height:1,
                      background:i<stepIdx?C.accent:"rgba(255,255,255,0.08)",zIndex:0 }}/>}
                    <div style={{ width:28,height:28,borderRadius:"50%",position:"relative",zIndex:1,flexShrink:0,
                      background:i<stepIdx?C.accent:i===stepIdx?C.accentLight:"rgba(255,255,255,0.06)",
                      border:i===stepIdx?`2px solid ${C.accentLight}`:`1px solid ${i<stepIdx?C.accent:"rgba(255,255,255,0.1)"}`,
                      display:"flex",alignItems:"center",justifyContent:"center",
                      fontSize:i<stepIdx?13:12,fontWeight:700,color:i<=stepIdx?"#fff":C.textMuted,
                      boxShadow:i===stepIdx?`0 0 0 3px rgba(157,78,221,0.25)`:"none",
                      transition:"all 0.2s" }}>
                      {i<stepIdx?"✓":i+1}
                    </div>
                    <div style={{ fontSize:9,letterSpacing:0.5,
                      textAlign:"center",paddingBottom:4,whiteSpace:"nowrap",
                      color:i===stepIdx?C.accentLight:C.textMuted,
                      fontWeight:i===stepIdx?700:400,marginTop:4 }}>{s.label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Step content */}
            <div style={{ flex:1,overflowY:"auto",padding:"14px 16px 0" }}>
              {renderStep()}
              <div style={{ height:14 }}/>
            </div>

            <MiniBar derived={derived} character={character}/>

            {/* Nav footer */}
            <div style={{ padding:"10px 16px 14px",background:C.bgDeep,
              borderTop:`1px solid ${C.border}`,display:"flex",gap:8 }}>
              {stepIdx>0&&(
                <button onClick={()=>setStepIdx(s=>s-1)} style={{ flex:1,padding:"11px 0",borderRadius:8,
                  fontSize:13,fontWeight:700,cursor:"pointer",
                  border:`1px solid ${C.border}`,background:"transparent",color:C.textMuted }}>
                  ← Back
                </button>
              )}
              {stepIdx<steps.length-1 ? (
                <button onClick={()=>setStepIdx(s=>s+1)} style={{ flex:2,padding:"11px 0",borderRadius:8,
                  fontSize:13,fontWeight:700,cursor:"pointer",border:"none",
                  background:`linear-gradient(135deg,${C.accent},${C.accentLight})`,
                  color:"#fff",boxShadow:`0 4px 16px rgba(123,44,191,0.4)` }}>
                  {stepIdx===steps.length-2?"⟡ Cast →":"Next →"}
                </button>
              ) : (
                <button onClick={handleNewSpell} style={{ flex:2,padding:"11px 0",borderRadius:8,
                  fontSize:13,fontWeight:700,cursor:"pointer",
                  border:`1px solid ${C.border}`,background:"transparent",color:C.textMuted }}>
                  ← New Spell
                </button>
              )}
            </div>
          {currentStep.id === 'cast' && (
            <CastFooter derived={derived} character={character} poolActionRef={castPoolRef}/>
          )}
          </>)}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
